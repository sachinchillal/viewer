<!DOCTYPE html>
<html lang="en" class="bg-white text-black">

<head>
  <base href="/">
  <!-- <base href="/viewer/"> -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewer</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <!-- Highlight.js for syntax highlighting (dark + light) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    id="hljs-dark" media="all">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    id="hljs-light" media="none">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- GitHub Markdown CSS (dark + light) -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css"
    id="markdown-dark" media="all">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css"
    id="markdown-light" media="none">
  <script>
    (function () {
      var mode = localStorage.getItem('viewer-theme');
      var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var html = document.documentElement;
      html.classList.add(dark ? 'dark' : 'light');
      html.classList.remove(dark ? 'light' : 'dark');
      html.style.colorScheme = dark ? 'dark' : 'light';
      var darkMedia = dark ? 'all' : 'none';
      var lightMedia = dark ? 'none' : 'all';
      var hljsDark = document.getElementById('hljs-dark');
      var hljsLight = document.getElementById('hljs-light');
      var markdownDark = document.getElementById('markdown-dark');
      var markdownLight = document.getElementById('markdown-light');
      if (hljsDark) hljsDark.media = darkMedia;
      if (hljsLight) hljsLight.media = lightMedia;
      if (markdownDark) markdownDark.media = darkMedia;
      if (markdownLight) markdownLight.media = lightMedia;
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (.dark &);
    html.dark {
      background-color: var(--color-gray-900);
      color: var(--color-gray-200);
    }
  </style>
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/toc.css">
  <link rel="stylesheet" href="css/explorer.css">
  <link rel="stylesheet" href="css/voice.css">
  <link rel="stylesheet" href="css/loader.css">
  <link rel="stylesheet" href="css/reading-time.css">
  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: inherit;
      color: inherit;
      overflow-x: hidden;
    }

    body.drawer-open {
      overflow: hidden;
    }

    .app-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: inherit;
    }

    .app-brand-logo {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      object-fit: contain;
    }

    @media (min-width: 1024px) {
      .app-brand-logo {
        width: 32px;
        height: 32px;
      }
    }

    .panel-drawer {
      transition: transform 0.2s ease-out;
    }

    @media (max-width: 1023px) {
      .panel-drawer {
        overflow-y: auto;
        max-height: 100vh;
      }

      .panel-drawer-left {
        transform: translateX(-100%);
      }

      .panel-drawer-right {
        transform: translateX(100%);
      }

      .panel-drawer.panel-open {
        transform: translateX(0);
      }
    }

    @media (min-width: 1024px) {
      .panel-drawer {
        transform: none !important;
      }

      .right-sidebar {
        position: sticky;
        top: 1rem;
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
        font-size: 12px;
        height: calc(100vh - 2rem);
      }
    }

    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0;
      /* margin: 0 auto; */
      padding: 45px;
    }

    .markdown-body ol,
    .markdown-body ul {
      list-style: auto;
    }

    @media (max-width: 1023px) {
      .markdown-body {
        max-width: 100%;
        padding: 12px 16px;
        padding: 0;
      }
    }

    .markdown-body pre,
    .markdown-body table {
      overflow-x: auto;
      max-width: 100%;
    }

    .markdown-body h1 {
      color: #00b000;
    }

    .markdown-body h2 {
      color: #00a000;
    }

    .markdown-body h3 {
      color: #009000;
    }

    .posts-reader {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 0 3rem;
    }

    .reader-hero {
      margin: 0 0 1.5rem;
      padding: 1.25rem 1.25rem 1rem;
      border: 1px solid var(--color-gray-200);
      border-radius: 1.25rem;
      background:
        linear-gradient(180deg, rgba(239, 246, 255, 0.95), rgba(255, 255, 255, 0.98));
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }

    html.dark .reader-hero {
      border-color: var(--color-gray-700);
      background:
        linear-gradient(180deg, rgba(30, 41, 59, 0.96), rgba(13, 17, 23, 0.98));
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
    }

    .reader-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.1);
      color: var(--color-blue-700);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    html.dark .reader-eyebrow {
      background: rgba(96, 165, 250, 0.14);
      color: var(--color-blue-300);
    }

    .reader-title {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      line-height: 1.1;
      color: var(--color-gray-900);
    }

    html.dark .reader-title {
      color: var(--color-gray-50);
    }

    .reader-subtitle {
      margin: 0.75rem 0 0;
      color: var(--color-gray-600);
      font-size: 1rem;
      line-height: 1.65;
      max-width: 62ch;
    }

    html.dark .reader-subtitle {
      color: var(--color-gray-300);
    }

    .reader-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-top: 1rem;
    }

    .reader-summary-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--color-gray-200);
      background: rgba(255, 255, 255, 0.84);
      color: var(--color-gray-700);
      font-size: 0.85rem;
    }

    html.dark .reader-summary-pill {
      border-color: var(--color-gray-700);
      background: rgba(15, 23, 42, 0.72);
      color: var(--color-gray-300);
    }

    .reader-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 0 0 1rem;
    }

    .reader-progress {
      font-size: 0.95rem;
      color: var(--color-gray-600);
      font-weight: 600;
    }

    html.dark .reader-progress {
      color: var(--color-gray-300);
    }

    .reader-nav-buttons {
      display: inline-flex;
      gap: 0.75rem;
      align-items: center;
    }

    .reader-nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.8rem;
      min-height: 2.8rem;
      padding: 0.7rem 0.95rem;
      border-radius: 999px;
      border: 1px solid var(--color-gray-300);
      background: rgba(255, 255, 255, 0.98);
      color: var(--color-gray-900);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }

    .reader-nav-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      background: var(--color-blue-50);
      color: var(--color-blue-700);
    }

    .reader-nav-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      box-shadow: none;
    }

    html.dark .reader-nav-btn {
      border-color: var(--color-gray-700);
      background: rgba(15, 23, 42, 0.92);
      color: var(--color-gray-50);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24);
    }

    html.dark .reader-nav-btn:hover:not(:disabled) {
      background: rgba(30, 41, 59, 0.98);
      color: var(--color-blue-300);
    }

    .reader-stage {
      position: relative;
      touch-action: pan-y;
    }

    .post-card,
    .reader-empty-state,
    .reader-error-state {
      border: 1px solid var(--color-gray-200);
      border-radius: 1.15rem;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    html.dark .post-card,
    html.dark .reader-empty-state,
    html.dark .reader-error-state {
      border-color: var(--color-gray-700);
      background: rgba(13, 17, 23, 0.98);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    }

    .post-card-header {
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--color-gray-200);
      background: linear-gradient(180deg, rgba(248, 250, 252, 0.96), rgba(255, 255, 255, 0.9));
    }

    html.dark .post-card-header {
      border-bottom-color: var(--color-gray-800);
      background: linear-gradient(180deg, rgba(22, 31, 45, 0.96), rgba(13, 17, 23, 0.92));
    }

    .post-card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.65rem;
    }

    .post-card-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      background: var(--color-blue-100);
      color: var(--color-blue-700);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    html.dark .post-card-badge {
      background: rgba(59, 130, 246, 0.18);
      color: var(--color-blue-300);
    }

    .post-card-hint {
      font-size: 0.8rem;
      color: var(--color-gray-500);
    }

    html.dark .post-card-hint {
      color: var(--color-gray-400);
    }

    .post-card-title {
      margin: 0;
      color: var(--color-gray-900);
      font-size: clamp(1.25rem, 2vw, 1.65rem);
      line-height: 1.25;
    }

    html.dark .post-card-title {
      color: var(--color-gray-50);
    }

    .post-card-body {
      padding: 1.15rem 1.25rem 1.35rem;
    }

    .post-card-body.markdown-body {
      max-width: none;
      min-width: 0;
      margin: 0;
      background: transparent;
      padding: 1.15rem 1.25rem 1.35rem;
    }

    .post-card-body.markdown-body>*:first-child {
      margin-top: 0;
    }

    .post-card-body.markdown-body>*:last-child {
      margin-bottom: 0;
    }

    .post-card-body.markdown-body h2 {
      margin-top: 0;
      color: var(--color-green-800);
    }

    html.dark .post-card-body.markdown-body h2 {
      color: var(--color-green-300);
    }

    .post-card-body.markdown-body p,
    .post-card-body.markdown-body li,
    .post-card-body.markdown-body blockquote {
      font-size: 1rem;
      line-height: 1.8;
    }

    .preamble-card .post-card-badge {
      background: var(--color-violet-100);
      color: var(--color-violet-700);
    }

    html.dark .preamble-card .post-card-badge {
      background: rgba(139, 92, 246, 0.18);
      color: var(--color-violet-300);
    }

    .reader-empty-state,
    .reader-error-state {
      padding: 2rem 1.25rem;
      text-align: center;
    }

    .reader-empty-title,
    .reader-error-title {
      margin: 0 0 0.5rem;
      color: var(--color-gray-900);
      font-size: 1.25rem;
      line-height: 1.3;
    }

    html.dark .reader-empty-title,
    html.dark .reader-error-title {
      color: var(--color-gray-50);
    }

    .reader-empty-copy,
    .reader-error-copy {
      margin: 0 auto;
      max-width: 52ch;
      color: var(--color-gray-500);
      line-height: 1.7;
    }

    html.dark .reader-empty-copy,
    html.dark .reader-error-copy {
      color: var(--color-gray-400);
    }

    .reader-error-state {
      border-color: var(--color-red-200);
      background: #fff7f7;
    }

    html.dark .reader-error-state {
      border-color: var(--color-red-900);
      background: rgba(69, 10, 10, 0.32);
    }

    body.reader-mode #toc-sidebar {
      display: none !important;
    }

    body.reader-mode #file-content.markdown-body {
      max-width: 100%;
      padding-top: 1rem;
      background: transparent;
    }

    .post-card-completion {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1rem 1.25rem 1.25rem;
      border-top: 1px solid var(--color-gray-200);
      background: linear-gradient(180deg, rgba(248, 250, 252, 0.96), rgba(255, 255, 255, 0.98));
    }

    html.dark .post-card-completion {
      border-top-color: var(--color-gray-800);
      background: linear-gradient(180deg, rgba(22, 31, 45, 0.96), rgba(13, 17, 23, 0.92));
    }

    .post-card-completion-status {
      margin: 0;
      font-size: 0.9rem;
      color: var(--color-green-800);
      font-weight: 600;
    }

    html.dark .post-card-completion-status {
      color: var(--color-green-300);
    }

    .post-card-completion-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0.7rem 1rem;
      border-radius: 0.85rem;
      border: 1px solid var(--color-blue-600);
      background: var(--color-blue-600);
      color: var(--color-white);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .post-card-completion-btn:hover {
      background: var(--color-blue-700);
      border-color: var(--color-blue-700);
      transform: translateY(-1px);
    }

    .post-card-completion-btn.is-unmark {
      border-color: var(--color-gray-300);
      background: var(--color-white);
      color: var(--color-gray-900);
    }

    html.dark .post-card-completion-btn.is-unmark {
      border-color: var(--color-gray-600);
      background: rgba(15, 23, 42, 0.92);
      color: var(--color-gray-50);
    }

    html.dark .post-card-completion-btn.is-unmark:hover {
      background: rgba(30, 41, 59, 0.98);
    }

    .reader-suggestions {
      margin-top: 1.25rem;
      padding: 1.15rem 1.25rem 1.25rem;
      border: 1px solid var(--color-gray-200);
      border-radius: 1.15rem;
      background: linear-gradient(180deg, rgba(248, 250, 252, 0.96), rgba(255, 255, 255, 0.98));
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    html.dark .reader-suggestions {
      border-color: var(--color-gray-700);
      background: linear-gradient(180deg, rgba(22, 31, 45, 0.96), rgba(13, 17, 23, 0.92));
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    }

    .reader-suggestions-title {
      margin: 0;
      color: var(--color-gray-900);
      font-size: 1.05rem;
      line-height: 1.3;
    }

    html.dark .reader-suggestions-title {
      color: var(--color-gray-50);
    }

    .reader-suggestions-copy {
      margin: 0.45rem 0 0;
      color: var(--color-gray-500);
      line-height: 1.65;
    }

    html.dark .reader-suggestions-copy {
      color: var(--color-gray-400);
    }

    .reader-suggestions-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.85rem;
      margin-top: 1rem;
    }

    .reader-suggestion-link {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: 1rem;
      border: 1px solid var(--color-gray-300);
      background: rgba(255, 255, 255, 0.96);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .reader-suggestion-link:hover {
      transform: translateY(-1px);
      border-color: var(--color-blue-400);
      background: var(--color-blue-50);
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.12);
    }

    html.dark .reader-suggestion-link {
      border-color: var(--color-gray-700);
      background: rgba(15, 23, 42, 0.9);
    }

    html.dark .reader-suggestion-link:hover {
      border-color: var(--color-blue-400);
      background: rgba(30, 41, 59, 0.98);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
    }

    .reader-suggestion-link.is-current {
      border-color: var(--color-blue-600);
      background: var(--color-blue-50);
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.2);
    }

    html.dark .reader-suggestion-link.is-current {
      border-color: var(--color-blue-400);
      background: rgba(30, 58, 95, 0.72);
      box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.28);
    }

    .reader-suggestion-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-gray-900);
      word-break: break-word;
    }

    html.dark .reader-suggestion-name {
      color: var(--color-gray-50);
    }

    .reader-suggestion-meta {
      font-size: 0.88rem;
      color: var(--color-gray-500);
    }

    html.dark .reader-suggestion-meta {
      color: var(--color-gray-400);
    }

    .reader-section-index {
      margin-top: 1.25rem;
      padding: 1.15rem 1.25rem 1.25rem;
      border: 1px solid var(--color-gray-200);
      border-radius: 1.15rem;
      background: linear-gradient(180deg, rgba(248, 250, 252, 0.96), rgba(255, 255, 255, 0.98));
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    html.dark .reader-section-index {
      border-color: var(--color-gray-700);
      background: linear-gradient(180deg, rgba(22, 31, 45, 0.96), rgba(13, 17, 23, 0.92));
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    }

    .reader-section-index-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-top: 1rem;
    }

    .reader-section-index-link {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: 0.85rem;
      border: 1px solid var(--color-gray-300);
      background: rgba(255, 255, 255, 0.96);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .reader-section-index-link:hover {
      transform: translateY(-1px);
      border-color: var(--color-blue-400);
      background: var(--color-blue-50);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.1);
    }

    .reader-section-index-link.is-current {
      border-color: var(--color-blue-600);
      background: var(--color-blue-50);
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.2);
    }

    html.dark .reader-section-index-link {
      border-color: var(--color-gray-700);
      background: rgba(15, 23, 42, 0.9);
    }

    html.dark .reader-section-index-link:hover {
      border-color: var(--color-blue-400);
      background: rgba(30, 41, 59, 0.98);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.24);
    }

    html.dark .reader-section-index-link.is-current {
      border-color: var(--color-blue-400);
      background: rgba(30, 58, 95, 0.72);
      box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.28);
    }

    .reader-section-index-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--color-gray-900);
      word-break: break-word;
    }

    html.dark .reader-section-index-label {
      color: var(--color-gray-50);
    }

    .progress-confirm-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(15, 23, 42, 0.45);
    }

    .progress-confirm-backdrop.hidden {
      display: none;
    }

    .progress-confirm-dialog {
      width: min(100%, 24rem);
      padding: 1.25rem;
      border-radius: 1rem;
      border: 1px solid var(--color-gray-200);
      background: var(--color-white);
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18);
    }

    html.dark .progress-confirm-dialog {
      border-color: var(--color-gray-700);
      background: #0d1117;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .progress-confirm-title {
      margin: 0 0 0.5rem;
      font-size: 1.1rem;
      color: var(--color-gray-900);
    }

    html.dark .progress-confirm-title {
      color: var(--color-gray-50);
    }

    .progress-confirm-copy {
      margin: 0 0 1rem;
      color: var(--color-gray-500);
      line-height: 1.6;
    }

    html.dark .progress-confirm-copy {
      color: var(--color-gray-400);
    }

    .progress-confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    .progress-confirm-btn {
      min-height: 2.5rem;
      padding: 0.55rem 0.9rem;
      border-radius: 0.7rem;
      border: 1px solid var(--color-gray-300);
      background: var(--color-white);
      color: var(--color-gray-900);
      font-weight: 600;
      cursor: pointer;
    }

    .progress-confirm-btn-primary {
      border-color: var(--color-blue-600);
      background: var(--color-blue-600);
      color: var(--color-white);
    }

    html.dark .progress-confirm-btn {
      border-color: var(--color-gray-600);
      background: rgba(15, 23, 42, 0.92);
      color: var(--color-gray-50);
    }

    html.dark .progress-confirm-btn-primary {
      border-color: var(--color-blue-600);
      background: var(--color-blue-600);
      color: var(--color-white);
    }

    @media (max-width: 1023px) {
      .posts-reader {
        padding-bottom: 1.75rem;
      }

      .reader-nav {
        align-items: stretch;
        flex-direction: column;
      }

      .reader-nav-buttons {
        width: 100%;
        justify-content: space-between;
      }

      .reader-hero,
      .post-card-header,
      .post-card-body.markdown-body,
      .reader-empty-state,
      .reader-error-state,
      .reader-suggestions,
      .reader-section-index {
        padding-left: 1rem;
        padding-right: 1rem;
      }
    }

    @media print {
      /* @media screen,
    print { */

      html,
      body {
        background: #fff !important;
        color: #000 !important;
        line-height: 1 !important;
      }

      ol,
      ul {
        line-height: 1.2;
      }

      .no-print,
      #toc-sidebar,
      #controls-sidebar,
      #mobile-header,
      #panel-backdrop,
      .reader-section-index {
        display: none !important;
        /* Hide elements in print */
      }

      pre,
      code {
        color: #000 !important;
        background: transparent !important;
        border: none !important;
      }

      .container a,
      .container h1 {
        color: #000 !important;
      }

      #directories-list li {
        color: #000 !important;
      }

      #directories-list .explorer-tree-item {
        color: #000 !important;
      }

      p,
      hr,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        margin: 0 !important;
      }


      .markdown-body {
        background-color: #fff !important;
        color: #000 !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .markdown-body a {
        color: #0550ae !important;
      }

      .markdown-body pre,
      .markdown-body code,
      .markdown-body .hljs {
        border: 1px solid #e1e4e8;
      }


      body.two-column-print .markdown-body {
        column-count: 2;
        column-gap: 0;
        /* column-gap: 2rem; */
      }

      body.two-column-print h1 {
        font-size: 1.25rem !important;
      }
    }
  </style>
</head>

<body>
  <div hidden aria-hidden="true">
    <span
      class="bg-gray-50 bg-blue-50 text-blue-300 bg-green-300 text-green-800 bg-violet-100 text-violet-300 text-violet-700 border-red-200 bg-red-200 text-red-900"></span>
  </div>
  <div id="panel-backdrop" class="fixed inset-0 z-40 bg-black/40 hidden lg:hidden no-print" aria-hidden="true"></div>
  <div class="w-full max-w-full px-3 sm:px-4 py-4 box-border">
    <div class="flex flex-col lg:flex-row lg:gap-6">
      <div id="toc-mount"></div>
      <main class="flex-1 min-w-0 w-full">
        <header id="mobile-header"
          class="no-print lg:hidden sticky top-0 z-30 -mx-3 sm:-mx-4 px-3 sm:px-4 py-2 mb-2 flex items-center justify-between gap-2 border-b border-gray-200 dark:border-gray-700 bg-inherit">
          <a href="./" class="app-brand text-blue-600 dark:text-blue-400 min-h-11 shrink-0">
            <img src="favicon-32x32.png" alt="" width="32" height="32" class="app-brand-logo" aria-hidden="true">
            <span class="text-xl font-bold leading-none">Viewer</span>
          </a>
          <div class="flex items-center gap-1 shrink-0">
            <button type="button" id="btn-mobile-toc" aria-expanded="false" aria-controls="toc-sidebar"
              aria-label="Open table of contents"
              class="min-h-11 px-3 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">Contents</button>
            <button type="button" id="btn-mobile-menu" aria-expanded="false" aria-controls="controls-sidebar"
              aria-label="Open menu"
              class="min-h-11 px-3 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">Menu</button>
          </div>
        </header>
        <div class="no-print hidden lg:flex justify-between items-center">
          <a href="./" class="app-brand text-blue-600 dark:text-blue-400">
            <img src="favicon-32x32.png" alt="" width="32" height="32" class="app-brand-logo" aria-hidden="true">
            <h1 class="text-2xl font-bold leading-none m-0">Viewer</h1>
          </a>
        </div>
        <div id="file-reading-time" class="file-reading-time no-print hidden" hidden></div>
        <div id="file-content" class="markdown-body mt-4 lg:mt-6">
          <p class="file-content-empty text-center text-gray-500 dark:text-gray-400 py-8 lg:py-12">
            Select a file from the File Explorer to view its contents.
          </p>
        </div>
      </main>
      <aside id="controls-sidebar"
        class="panel-drawer panel-drawer-right right-sidebar no-print flex flex-col fixed inset-y-0 right-0 z-50 w-[min(85vw,18rem)] p-4 bg-white dark:bg-gray-900 border-l border-gray-200 dark:border-gray-700 shadow-lg lg:static lg:inset-auto lg:z-auto lg:w-56 lg:shrink-0 lg:p-0 lg:shadow-none lg:border-0">
        <div id="explorer-mount"></div>
        <i class="mt-auto"></i>
        <div class="mt-4">
          <p class="font-medium text-gray-700 dark:text-gray-400">Toggle tags</p>
          <div id="tag-toggle-controls" class="mt-1 flex flex-col gap-1"></div>
        </div>
        <i class="mt-auto"></i>
        <div id="voice-mount"></div>
      </aside>
    </div>
  </div>

  <div id="progress-confirm-backdrop" class="progress-confirm-backdrop hidden no-print" aria-hidden="true">
    <div class="progress-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="progress-confirm-title">
      <h2 id="progress-confirm-title" class="progress-confirm-title">Confirm</h2>
      <p id="progress-confirm-copy" class="progress-confirm-copy"></p>
      <div class="progress-confirm-actions">
        <button type="button" id="progress-confirm-cancel" class="progress-confirm-btn">Cancel</button>
        <button type="button" id="progress-confirm-submit"
          class="progress-confirm-btn progress-confirm-btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <script src="js/loader.js"></script>
  <script src="js/reading-time.js"></script>
  <script src="js/explorer.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/toc.js"></script>
  <script src="js/voice.js"></script>
  <script>
    // const APP_BASE_PATH = '/' + window.location.pathname
    //   .split('/')
    //   .filter(Boolean)[0];
    // const API_BASE_URL = `${APP_BASE_PATH}/api`;
    const API_BASE_URL = '/api';
    const TAGS_TO_TOGGLE = [
      {
        tag: 'blockquote',
        label: 'Blockquote'
      }
    ];
    const TAG_TOGGLE_STORAGE_KEY = 'viewer-tag-toggles';
    const POSTS_CARD_STORAGE_KEY = 'viewer-posts-card';
    const tagToggleContainer = document.getElementById('tag-toggle-controls');

    let closeMobilePanels = () => { };
    let readerCards = [];
    let currentCardIndex = 0;
    let currentReaderFilePath = '';
    let currentReaderFileName = '';
    let currentReaderSiblingFiles = [];
    let readerTouchStart = null;
    let sectionProgress = {};
    let pendingProgressAction = null;

    if (window.ViewerExplorer) {
      window.ViewerExplorer.init({
        apiBaseUrl: API_BASE_URL,
        onNavigate: (path) => updateUrl(path),
        onFileData: (data, root) => {
          currentReaderSiblingFiles = extractSiblingFileNames(data);
          if (isMarkdownFilePath(root)) {
            loadPostContent(root);
          } else {
            renderFileContent(data.fileContent, root);
          }
        },
        onEmpty: () => {
          currentReaderSiblingFiles = [];
          showEmptyFileContent();
        },
      });
    }
    if (window.ViewerToc) {
      window.ViewerToc.init({
        closeMobilePanels: () => closeMobilePanels()
      });
    }
    if (window.ViewerSettings) {
      window.ViewerSettings.init({
        closeMobilePanels: () => closeMobilePanels()
      });
    }
    if (window.ViewerVoice) {
      window.ViewerVoice.init({ contentRootSelector: '#file-content' });
    }
    init();
    initTagToggles();
    initMobilePanels();
    initProgressConfirmModal();


    function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const pathFromUrl = urlParams.get('path') || '';
      if (window.ViewerExplorer) {
        window.ViewerExplorer.setCurrentRoot(pathFromUrl);
        window.ViewerExplorer.load(pathFromUrl);
      }

      const fileContentElement = document.getElementById('file-content');
      if (fileContentElement) {
        fileContentElement.addEventListener('click', handleFileContentLinkClick);
        fileContentElement.addEventListener('touchstart', handleReaderTouchStart, { passive: true });
        fileContentElement.addEventListener('touchend', handleReaderTouchEnd, { passive: true });
      }

      window.addEventListener('popstate', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const pathFromUrl = urlParams.get('path') || '';
        if (window.ViewerExplorer) {
          window.ViewerExplorer.setCurrentRoot(pathFromUrl);
          window.ViewerExplorer.load(pathFromUrl);
        }
      });
    }

    function navigateToViewerPath(path, hash) {
      updateUrl(path, hash);
      if (window.ViewerExplorer) {
        window.ViewerExplorer.setCurrentRoot(path);
        return window.ViewerExplorer.load(path);
      }
      return Promise.resolve(false);
    }

    function handleFileContentLinkClick(e) {
      const completionButton = e.target.closest && e.target.closest('[data-completion-action]');
      if (completionButton && e.currentTarget.contains(completionButton)) {
        e.preventDefault();
        const action = completionButton.getAttribute('data-completion-action');
        const sectionId = completionButton.getAttribute('data-section-id');
        if (action && sectionId) {
          openProgressConfirm(action, sectionId);
        }
        return;
      }

      const navButton = e.target.closest && e.target.closest('[data-reader-nav]');
      if (navButton && e.currentTarget.contains(navButton)) {
        e.preventDefault();
        const direction = navButton.getAttribute('data-reader-nav');
        if (direction === 'prev') {
          showPreviousReaderCard();
        } else if (direction === 'next') {
          showNextReaderCard();
        }
        return;
      }

      const sectionIndexButton = e.target.closest && e.target.closest('[data-reader-card-index]');
      if (sectionIndexButton && e.currentTarget.contains(sectionIndexButton)) {
        e.preventDefault();
        const index = Number(sectionIndexButton.getAttribute('data-reader-card-index'));
        if (Number.isInteger(index)) {
          showReaderCard(index);
        }
        return;
      }

      const anchor = e.target.closest && e.target.closest('a');
      if (!anchor || !e.currentTarget.contains(anchor)) return;

      const href = anchor.getAttribute('href');
      if (!href || href === '#' || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) {
        return;
      }

      // Same-document anchor
      if (href.charAt(0) === '#') {
        e.preventDefault();
        const id = decodeURIComponent(href.slice(1));
        document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
        history.replaceState(null, '', window.location.pathname + window.location.search + '#' + id);
        return;
      }

      let url;
      try {
        url = new URL(href, window.location.href);
      } catch (_) {
        return;
      }

      // In-app viewer links: /?path=...
      if (url.origin === window.location.origin && url.searchParams.has('path')) {
        e.preventDefault();
        const path = url.searchParams.get('path') || '';
        const hash = url.hash ? url.hash.slice(1) : '';
        navigateToViewerPath(path, hash);
      }
    }

    function handleReaderTouchStart(e) {
      const stage = e.target.closest && e.target.closest('[data-reader-stage]');
      if (!stage || !readerCards.length || e.touches.length !== 1) {
        readerTouchStart = null;
        return;
      }
      const touch = e.touches[0];
      readerTouchStart = { x: touch.clientX, y: touch.clientY };
    }

    function handleReaderTouchEnd(e) {
      if (!readerTouchStart || !readerCards.length || e.changedTouches.length !== 1) {
        readerTouchStart = null;
        return;
      }
      const touch = e.changedTouches[0];
      const dx = touch.clientX - readerTouchStart.x;
      const dy = touch.clientY - readerTouchStart.y;
      readerTouchStart = null;

      if (Math.abs(dx) < 50 || Math.abs(dx) <= Math.abs(dy) * 1.2) {
        return;
      }
      if (dx < 0) {
        showNextReaderCard();
      } else {
        showPreviousReaderCard();
      }
    }

    function initMobilePanels() {
      const mobileMq = window.matchMedia('(max-width: 1023px)');
      const backdrop = document.getElementById('panel-backdrop');
      const btnToc = document.getElementById('btn-mobile-toc');
      const btnMenu = document.getElementById('btn-mobile-menu');
      const tocSidebar = document.getElementById('toc-sidebar');
      const controlsSidebar = document.getElementById('controls-sidebar');
      let openPanel = null;

      function isMobile() {
        return mobileMq.matches;
      }

      function setExpanded(btn, expanded) {
        if (btn) btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      }

      closeMobilePanels = function () {
        openPanel = null;
        tocSidebar?.classList.remove('panel-open');
        controlsSidebar?.classList.remove('panel-open');
        setExpanded(btnToc, false);
        setExpanded(btnMenu, false);
        backdrop?.classList.add('hidden');
        backdrop?.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('drawer-open');
      };

      function openPanelType(type) {
        if (!isMobile()) return;
        const panel = type === 'toc' ? tocSidebar : controlsSidebar;
        const btn = type === 'toc' ? btnToc : btnMenu;
        if (!panel || panel.classList.contains('hidden')) return;

        if (openPanel === type) {
          closeMobilePanels();
          return;
        }

        closeMobilePanels();
        openPanel = type;
        panel.classList.add('panel-open');
        setExpanded(btnToc, type === 'toc');
        setExpanded(btnMenu, type === 'controls');
        backdrop?.classList.remove('hidden');
        backdrop?.setAttribute('aria-hidden', 'false');
        document.body.classList.add('drawer-open');
      }

      btnToc?.addEventListener('click', () => openPanelType('toc'));
      btnMenu?.addEventListener('click', () => openPanelType('controls'));
      backdrop?.addEventListener('click', closeMobilePanels);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMobilePanels();
      });
      mobileMq.addEventListener('change', (e) => {
        if (!e.matches) closeMobilePanels();
      });
    }

    function getSavedTagToggles() {
      try {
        const raw = localStorage.getItem(TAG_TOGGLE_STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        console.error('Failed to parse tag toggle settings', e);
        return {};
      }
    }

    function saveTagToggles(map) {
      try {
        localStorage.setItem(TAG_TOGGLE_STORAGE_KEY, JSON.stringify(map || {}));
      } catch (e) {
        console.error('Failed to save tag toggle settings', e);
      }
    }

    function getSavedPostsCards() {
      try {
        const raw = localStorage.getItem(POSTS_CARD_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
          return {};
        }
        return parsed;
      } catch (e) {
        console.error('Failed to parse saved posts card', e);
        return {};
      }
    }

    function savePostsCardPosition(filePath, index, sectionId) {
      const path = String(filePath || '').trim();
      if (!path || !Number.isInteger(index)) return;
      try {
        const map = getSavedPostsCards();
        const entry = { index };
        if (sectionId != null && String(sectionId) !== '') {
          entry.sectionId = String(sectionId);
        }
        map[path] = entry;
        localStorage.setItem(POSTS_CARD_STORAGE_KEY, JSON.stringify(map));
      } catch (e) {
        console.error('Failed to save posts card', e);
      }
    }

    function resolveSavedCardIndex(filePath, cards) {
      const path = String(filePath || '').trim();
      const list = Array.isArray(cards) ? cards : [];
      if (!path || !list.length) return 0;

      const saved = getSavedPostsCards()[path];
      if (!saved || typeof saved !== 'object') return 0;

      if (saved.sectionId != null && String(saved.sectionId) !== '') {
        const sectionIndex = list.findIndex((card) => (
          card && card.kind === 'section' && String(card.sectionId) === String(saved.sectionId)
        ));
        if (sectionIndex >= 0) return sectionIndex;
      }

      const index = Number(saved.index);
      if (Number.isInteger(index)) {
        return Math.max(0, Math.min(index, list.length - 1));
      }
      return 0;
    }

    function initTagToggles() {
      if (!tagToggleContainer || !Array.isArray(TAGS_TO_TOGGLE) || TAGS_TO_TOGGLE.length === 0) return;

      const saved = getSavedTagToggles();
      tagToggleContainer.innerHTML = '';

      TAGS_TO_TOGGLE.forEach(({ tag, label }) => {
        const id = `toggle-tag-${tag}`;
        const isEnabled = saved[tag] !== false;

        const wrapper = document.createElement('label');
        wrapper.setAttribute('for', id);
        wrapper.className = 'w-full flex items-center gap-1.5 cursor-pointer select-none text-gray-700 dark:text-gray-300';
        wrapper.innerHTML = `
          <input type="checkbox" id="${id}" data-tag-toggle="${tag}"
            class="rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 dark:bg-gray-800">
          <span>${label}</span>
        `;

        const input = wrapper.querySelector('input');
        if (input) {
          input.checked = isEnabled;
          input.addEventListener('change', () => {
            const current = getSavedTagToggles();
            current[tag] = input.checked;
            saveTagToggles(current);
            applyTagVisibility(current);
          });
        }

        tagToggleContainer.appendChild(wrapper);
      });

      applyTagVisibility(saved);
    }

    function applyTagVisibility(settings) {
      const fileContentElement = document.getElementById('file-content');
      if (!fileContentElement || !Array.isArray(TAGS_TO_TOGGLE)) return;

      const state = settings || getSavedTagToggles();

      TAGS_TO_TOGGLE.forEach(({ tag }) => {
        const enabled = state[tag] !== false;
        fileContentElement.querySelectorAll(tag).forEach((el) => {
          el.classList.toggle('hidden', !enabled);
        });
      });
    }
    function encodeViewerPath(path) {
      // Encode only &, =, % so slashes stay as /
      return String(path || '').replace(/%/g, '%25').replace(/&/g, '%26').replace(/=/g, '%3D');
    }

    function updateUrl(path, hash) {
      let newUrl = window.location.origin + window.location.pathname;
      if (path) {
        newUrl += '?path=' + encodeViewerPath(path);
      }
      if (hash) {
        newUrl += '#' + String(hash).replace(/^#/, '');
      }
      window.history.pushState({ path, hash: hash || '' }, '', newUrl);
    }

    function escapeHtmlAttr(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function escapeHtmlText(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function isMarkdownFilePath(filePath) {
      return /\.md$/i.test(filePath || '');
    }

    function createMarkedRenderer(filePath) {
      const renderer = new marked.Renderer();
      renderer.code = function (code, lang) {
        const langClass = lang ? ` class="language-${lang}"` : '';
        return `<pre><code${langClass}>${escapeHtmlAttr(code)}</code></pre>`;
      };
      renderer.image = function (hrefOrToken, title, text) {
        let href;
        let imgTitle;
        let alt;
        if (hrefOrToken && typeof hrefOrToken === 'object') {
          href = hrefOrToken.href;
          imgTitle = hrefOrToken.title;
          alt = hrefOrToken.text;
        } else {
          href = hrefOrToken;
          imgTitle = title;
          alt = text;
        }
        const src = toAssetUrl(href, filePath);
        const titleAttr = imgTitle ? ` title="${escapeHtmlAttr(imgTitle)}"` : '';
        return `<img src="${escapeHtmlAttr(src)}" alt="${escapeHtmlAttr(alt || '')}"${titleAttr}>`;
      };
      renderer.link = function (hrefOrToken, title, text) {
        let href;
        let linkTitle;
        let linkText;
        if (hrefOrToken && typeof hrefOrToken === 'object') {
          href = hrefOrToken.href;
          linkTitle = hrefOrToken.title;
          linkText = hrefOrToken.tokens && this.parser
            ? this.parser.parseInline(hrefOrToken.tokens)
            : hrefOrToken.text;
        } else {
          href = hrefOrToken;
          linkTitle = title;
          linkText = text;
        }
        const resolvedHref = toInternalLinkHref(href, filePath);
        const titleAttr = linkTitle ? ` title="${escapeHtmlAttr(linkTitle)}"` : '';
        const isExternal = /^(https?:|mailto:|tel:|\/\/)/i.test(href || '');
        const externalAttrs = isExternal ? ' target="_blank" rel="noopener noreferrer"' : '';
        return `<a href="${escapeHtmlAttr(resolvedHref || '')}"${titleAttr}${externalAttrs}>${linkText}</a>`;
      };
      return renderer;
    }

    function renderMarkdownToHtml(markdown, filePath) {
      return marked.parse(markdown || '', {
        breaks: true,
        gfm: true,
        renderer: createMarkedRenderer(filePath),
      });
    }

    function setReaderMode(enabled) {
      document.body.classList.toggle('reader-mode', Boolean(enabled));
      if (enabled) {
        if (window.ViewerToc) window.ViewerToc.build(null);
        closeMobilePanels();
      }
    }

    function updateReadingTime(source) {
      if (window.ViewerReadingTime) {
        window.ViewerReadingTime.fill('#file-reading-time', source);
      }
    }

    function readingTimeHtml(source, options) {
      if (!window.ViewerReadingTime) return '';
      return window.ViewerReadingTime.renderHtml(source, options);
    }

    function applyContentEnhancements(fileContentElement, options = {}) {
      const shouldBuildToc = options.buildToc !== false;
      applyTagVisibility();
      if (shouldBuildToc) {
        if (window.ViewerToc) window.ViewerToc.build(fileContentElement);
      } else {
        if (window.ViewerToc) window.ViewerToc.build(null);
      }
      if (window.ViewerVoice) window.ViewerVoice.enhance(fileContentElement);

      if (window.location.hash) {
        const id = window.location.hash.slice(1);
        setTimeout(() => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' }), 100);
      }

      setTimeout(() => {
        if (typeof hljs !== 'undefined' && hljs.highlightElement) {
          fileContentElement.querySelectorAll('pre code').forEach((block) => {
            try {
              block.classList.remove('hljs');
              hljs.highlightElement(block);
            } catch (err) {
              console.error('Error highlighting code block:', err);
            }
          });
        } else {
          console.error('Highlight.js is not loaded');
        }
      }, 0);
    }

    function showEmptyFileContent(title = 'Select a file from the File Explorer to view its contents.', description = 'Choose a markdown file to open it as a stack of readable section cards.', options = {}) {
      const fileContentElement = document.getElementById('file-content');
      if (!fileContentElement) return;
      readerCards = [];
      currentCardIndex = 0;
      sectionProgress = {};
      currentReaderSiblingFiles = [];
      setReaderMode(Boolean(options.readerMode));
      fileContentElement.innerHTML =
        `<div class="posts-reader">
          <section class="reader-empty-state">
            <h2 class="reader-empty-title">${escapeHtmlText(title)}</h2>
            <p class="reader-empty-copy">${escapeHtmlText(description)}</p>
          </section>
        </div>`;
      if (window.ViewerVoice) window.ViewerVoice.stop();
      if (window.ViewerToc) window.ViewerToc.build(null);
      updateReadingTime('');
    }

    function showReaderError(message, detail = 'Please try another file or check whether the post API is available.') {
      const fileContentElement = document.getElementById('file-content');
      if (!fileContentElement) return;
      readerCards = [];
      currentCardIndex = 0;
      sectionProgress = {};
      currentReaderSiblingFiles = [];
      setReaderMode(true);
      fileContentElement.innerHTML = `
        <div class="posts-reader">
          <section class="reader-error-state">
            <h2 class="reader-error-title">Unable to load this post</h2>
            <p class="reader-error-copy">${escapeHtmlText(message || detail)}</p>
          </section>
        </div>`;
      if (window.ViewerVoice) window.ViewerVoice.stop();
      if (window.ViewerToc) window.ViewerToc.build(null);
      updateReadingTime('');
    }

    function buildReaderCards(postsData, filePath, fileName) {
      const cards = [];
      const preamble = typeof postsData?.preamble === 'string' ? postsData.preamble : '';
      const sections = Array.isArray(postsData?.sections) ? postsData.sections : [];

      if (preamble && preamble.trim()) {
        cards.push({
          kind: 'intro',
          label: 'Introduction',
          title: 'Opening context',
          markdown: preamble,
          filePath,
          fileName,
        });
      }

      sections.forEach((section, index) => {
        cards.push({
          kind: 'section',
          sectionId: String(section.id ?? index),
          label: `Section ${index + 1}`,
          title: section.title || `Section ${index + 1}`,
          markdown: section.markdown || '',
          filePath,
          fileName,
        });
      });

      return cards;
    }

    function updateReaderProgressText(index, total) {
      return `Card ${index + 1} of ${total}`;
    }

    function isSameLocalDayClient(ts, ref = Date.now()) {
      const d1 = new Date(ts);
      const d2 = new Date(ref);
      return d1.getFullYear() === d2.getFullYear()
        && d1.getMonth() === d2.getMonth()
        && d1.getDate() === d2.getDate();
    }

    function getSectionTimestamps(sectionId) {
      const timestamps = sectionProgress[String(sectionId)];
      return Array.isArray(timestamps) ? timestamps : [];
    }

    function isSectionCompletedToday(sectionId) {
      return getSectionTimestamps(sectionId).some((ts) => isSameLocalDayClient(ts));
    }

    function renderCompletionFooter(activeCard) {
      if (!activeCard || activeCard.kind !== 'section' || activeCard.sectionId == null) {
        return '';
      }
      const completedToday = isSectionCompletedToday(activeCard.sectionId);
      const action = completedToday ? 'unmark' : 'mark';
      const buttonLabel = completedToday ? 'Unmark for today' : 'Mark as completed';
      const statusHtml = completedToday
        ? '<p class="post-card-completion-status">Completed today</p>'
        : '';
      return `
        <div class="post-card-completion">
          ${statusHtml}
          <button type="button"
            class="post-card-completion-btn${completedToday ? ' is-unmark' : ''}"
            data-completion-action="${action}"
            data-section-id="${escapeHtmlAttr(activeCard.sectionId)}">${escapeHtmlText(buttonLabel)}</button>
        </div>`;
    }

    function extractSiblingFileNames(data) {
      if (Array.isArray(data?.list) && data.list.length > 0) {
        return data.list.filter((name) => typeof name === 'string' && name && name !== '..');
      }
      if (Array.isArray(data?.tree)) {
        return data.tree
          .filter((node) => node && node.type === 'file' && typeof node.name === 'string' && node.name)
          .map((node) => node.name);
      }
      return [];
    }

    function getCurrentReaderDirectoryPath() {
      const parts = String(currentReaderFilePath || '').split('/').filter(Boolean);
      parts.pop();
      return parts.join('/');
    }

    function buildSuggestionPath(fileName) {
      const parentPath = getCurrentReaderDirectoryPath();
      return parentPath ? `${parentPath}/${fileName}` : fileName;
    }

    function getSuggestedMarkdownFiles() {
      const currentFileName = String(currentReaderFileName || '').trim();
      const files = currentReaderSiblingFiles.filter((name) => {
        return /\.md$/i.test(name) && name !== '..';
      });
      if (currentFileName && /\.md$/i.test(currentFileName) && !files.includes(currentFileName)) {
        files.unshift(currentFileName);
      }
      return files;
    }

    function renderSectionIndex() {
      if (!readerCards.length) {
        return '';
      }

      const sectionItems = readerCards
        .map((card, index) => ({ card, index }))
        .filter(({ card }) => card.kind === 'section');
      if (!sectionItems.length) {
        return '';
      }

      const links = sectionItems.map(({ card, index }) => {
        const isCurrent = index === currentCardIndex;
        return `
          <button type="button"
            class="reader-section-index-link${isCurrent ? ' is-current' : ''}"
            data-reader-card-index="${index}"
            ${isCurrent ? 'aria-current="page"' : ''}>
            <span class="reader-section-index-label">${escapeHtmlText(card.title)}</span>
          </button>`;
      }).join('');

      return `
        <section class="reader-section-index no-print">
          <h2>Sections</h2>
          <p>Jump to any section.</p>
          <div class="reader-section-index-list">${links}</div>
        </section>`;
    }

    function renderSuggestionsSection() {
      if (!readerCards.length || currentCardIndex !== readerCards.length - 1) {
        return '';
      }
      const suggestedFiles = getSuggestedMarkdownFiles();
      if (!suggestedFiles.length) {
        return '';
      }

      const currentFileName = String(currentReaderFileName || '').trim();
      const suggestionCards = suggestedFiles.map((fileName, index) => {
        const href = toViewerHref(buildSuggestionPath(fileName));
        const label = fileName.replace(/\.md$/i, '').replace(/-/g, ' ').trim();
        const isCurrent = fileName === currentFileName;
        return `
          <a class="reader-suggestion-link${isCurrent ? ' is-current' : ''}" href="${escapeHtmlAttr(href)}"${isCurrent ? ' aria-current="page"' : ''}>
            <span>${index + 1}</span>
            <span class="reader-suggestion-name">${escapeHtmlText(label)}</span>
          </a>`;
      }).join('');

      return `
        <section class="reader-suggestions" aria-labelledby="reader-suggestions-title">
          <h2 id="reader-suggestions-title" class="reader-suggestions-title">Suggested next reads</h2>
          <p class="reader-suggestions-copy">Markdown files in this folder you can open next.</p>
          <div class="reader-suggestions-list">${suggestionCards}</div>
        </section>`;
    }

    function initProgressConfirmModal() {
      const backdrop = document.getElementById('progress-confirm-backdrop');
      const cancelBtn = document.getElementById('progress-confirm-cancel');
      const submitBtn = document.getElementById('progress-confirm-submit');

      cancelBtn?.addEventListener('click', closeProgressConfirm);
      submitBtn?.addEventListener('click', submitProgressAction);
      backdrop?.addEventListener('click', (e) => {
        if (e.target === backdrop) {
          closeProgressConfirm();
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && backdrop && !backdrop.classList.contains('hidden')) {
          closeProgressConfirm();
        }
      });
    }

    function openProgressConfirm(action, sectionId) {
      const backdrop = document.getElementById('progress-confirm-backdrop');
      const titleEl = document.getElementById('progress-confirm-title');
      const copyEl = document.getElementById('progress-confirm-copy');
      const submitBtn = document.getElementById('progress-confirm-submit');
      if (!backdrop || !titleEl || !copyEl || !submitBtn) return;

      pendingProgressAction = { action, sectionId: String(sectionId) };
      if (action === 'unmark') {
        titleEl.textContent = 'Unmark completion';
        copyEl.textContent = 'Remove today\'s completion for this section?';
        submitBtn.textContent = 'Unmark';
      } else {
        titleEl.textContent = 'Mark as completed';
        copyEl.textContent = 'Mark this section as completed for today?';
        submitBtn.textContent = 'Mark completed';
      }

      backdrop.classList.remove('hidden');
      backdrop.setAttribute('aria-hidden', 'false');
    }

    function closeProgressConfirm() {
      const backdrop = document.getElementById('progress-confirm-backdrop');
      pendingProgressAction = null;
      if (!backdrop) return;
      backdrop.classList.add('hidden');
      backdrop.setAttribute('aria-hidden', 'true');
    }

    function submitProgressAction() {
      if (!pendingProgressAction || !currentReaderFilePath) {
        closeProgressConfirm();
        return;
      }

      const { action, sectionId } = pendingProgressAction;
      closeProgressConfirm();

      if (window.ViewerLoader) {
        window.ViewerLoader.show('#file-content');
      }

      fetch(`${API_BASE_URL}/posts/progress`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          root: currentReaderFilePath,
          sectionId,
          action,
        }),
      })
        .then(async (response) => {
          const data = await response.json();
          if (!response.ok) {
            showReaderError(formatApiError(data, response.status));
            return;
          }
          sectionProgress[sectionId] = Array.isArray(data.timestamps) ? data.timestamps : [];
          renderActiveReaderCard();
        })
        .catch((error) => {
          console.error('Error saving section progress:', error);
          showReaderError('Failed to save completion status.');
        })
        .finally(() => {
          if (window.ViewerLoader) {
            window.ViewerLoader.hide('#file-content');
          }
        });
    }

    function loadSectionProgress(root) {
      const url = `${API_BASE_URL}/posts/progress?root=${encodeURIComponent(root)}`;
      return fetch(url, { cache: 'no-store' })
        .then(async (response) => {
          const data = await response.json();
          if (!response.ok) {
            sectionProgress = {};
            return false;
          }
          sectionProgress = data.sections && typeof data.sections === 'object' ? data.sections : {};
          return true;
        })
        .catch((error) => {
          console.error('Error fetching section progress:', error);
          sectionProgress = {};
          return false;
        });
    }

    function renderActiveReaderCard() {
      const fileContentElement = document.getElementById('file-content');
      if (!fileContentElement) return;
      const activeCard = readerCards[currentCardIndex];
      if (!activeCard) {
        showEmptyFileContent('No readable content found.', 'This markdown file does not contain any section content to render as cards.', { readerMode: true });
        return;
      }
      const totalCards = readerCards.length;
      const introCopy = activeCard.kind === 'intro'
        ? 'Start with the opening context, then move through the sections one card at a time.'
        : 'Focused reading mode with one section per card for quick rereads.';
      const isPrevDisabled = currentCardIndex === 0;
      const isNextDisabled = currentCardIndex === totalCards - 1;

      const remainingMarkdown = readerCards.slice(currentCardIndex).map((card) => card.markdown || '');
      const remainingTimesHtml = readingTimeHtml(remainingMarkdown.join('\n'), {
        compact: true,
        readSuffix: 'left to read',
        studySuffix: 'left to study',
      });
      const cardTimesHtml = readingTimeHtml(activeCard.markdown, { compact: true });

      const heroHtml = ``;
      const heroHtml1 = `
        <section class="reader-hero">
          <div class="reader-eyebrow">Posts Reader</div>
          <h1 class="reader-title">${escapeHtmlText(currentReaderFileName.replace(/\.md$/i, ''))}</h1>
          <p class="reader-subtitle">${escapeHtmlText(introCopy)}</p>
          <div class="reader-summary">
            <span class="reader-summary-pill">${updateReaderProgressText(currentCardIndex, totalCards)}</span>
            <span class="reader-summary-pill">${escapeHtmlText(activeCard.label)}</span>
            <span class="reader-summary-pill">Swipe or use arrows</span>
          </div>
        </section>`;

      fileContentElement.innerHTML = `
        <div class="posts-reader">
          ${heroHtml}
          <div class="reader-nav">
            <div class="reader-progress">
              <div class="reader-progress-row">
                <span>${escapeHtmlText(updateReaderProgressText(currentCardIndex, totalCards))}</span>
                ${remainingTimesHtml}
              </div>
            </div>
            <div class="reader-nav-buttons">
              <button type="button" class="reader-nav-btn" data-reader-nav="prev" aria-label="Previous card" ${isPrevDisabled ? 'disabled' : ''}>&larr;</button>
              <button type="button" class="reader-nav-btn" data-reader-nav="next" aria-label="Next card" ${isNextDisabled ? 'disabled' : ''}>&rarr;</button>
            </div>
          </div>
          <div class="reader-stage" data-reader-stage>
            <article class="post-card${activeCard.kind === 'intro' ? ' preamble-card' : ''}" data-reader-card>
              <div class="post-card-header">
                <div class="post-card-meta">
                  <span class="post-card-badge">${escapeHtmlText(activeCard.label)}</span>
                  <span class="post-card-hint">${activeCard.kind === 'intro' ? 'Read this first' : 'Swipe left or right to continue'}</span>
                  ${cardTimesHtml ? `<div class="post-card-times">${cardTimesHtml}</div>` : ''}
                </div>
              </div>
              <div class="post-card-body markdown-body">${renderMarkdownToHtml(activeCard.markdown, currentReaderFilePath)}</div>
              ${renderCompletionFooter(activeCard)}
            </article>
          </div>
          ${renderSectionIndex()}
          ${renderSuggestionsSection()}
        </div>`;

      setReaderMode(true);
      applyContentEnhancements(fileContentElement, { buildToc: false });
    }

    function showReaderCard(index) {
      if (!readerCards.length) return;
      currentCardIndex = Math.max(0, Math.min(index, readerCards.length - 1));
      const activeCard = readerCards[currentCardIndex];
      savePostsCardPosition(
        currentReaderFilePath,
        currentCardIndex,
        activeCard && activeCard.kind === 'section' ? activeCard.sectionId : undefined
      );
      renderActiveReaderCard();
    }

    function showPreviousReaderCard() {
      if (currentCardIndex > 0) {
        showReaderCard(currentCardIndex - 1);
      }
    }

    function showNextReaderCard() {
      if (currentCardIndex < readerCards.length - 1) {
        showReaderCard(currentCardIndex + 1);
      }
    }

    function renderPostsContent(data, filePath) {
      const fileName = data && typeof data.file === 'string' && data.file
        ? data.file
        : (filePath.split('/').filter(Boolean).pop() || 'Markdown post');
      currentReaderFilePath = filePath;
      currentReaderFileName = fileName;
      readerCards = buildReaderCards(data, filePath, fileName);

      if (!readerCards.length) {
        currentCardIndex = 0;
        showEmptyFileContent('No readable content found.', 'This markdown file does not contain any section content to render as cards.', { readerMode: true });
        return;
      }
      currentCardIndex = resolveSavedCardIndex(filePath, readerCards);
      renderActiveReaderCard();
    }

    function loadPostContent(root) {
      const postsUrl = `${API_BASE_URL}/posts?root=${encodeURIComponent(root)}`;
      const progressUrl = `${API_BASE_URL}/posts/progress?root=${encodeURIComponent(root)}`;

      if (window.ViewerLoader) {
        window.ViewerLoader.show('#file-content');
      }

      return Promise.all([
        fetch(postsUrl, { cache: 'no-store' }).then(async (response) => ({
          ok: response.ok,
          status: response.status,
          data: await response.json(),
        })),
        fetch(progressUrl, { cache: 'no-store' }).then(async (response) => ({
          ok: response.ok,
          status: response.status,
          data: await response.json(),
        })),
      ])
        .then(([postsRes, progressRes]) => {
          if (!postsRes.ok) {
            showReaderError(formatApiError(postsRes.data, postsRes.status));
            return false;
          }
          sectionProgress = progressRes.ok && progressRes.data.sections && typeof progressRes.data.sections === 'object'
            ? progressRes.data.sections
            : {};
          renderPostsContent(postsRes.data, root);
          return true;
        })
        .catch(error => {
          console.error('Error fetching posts:', error);
          showReaderError('Failed to load this markdown post.');
          return false;
        })
        .finally(() => {
          if (window.ViewerLoader) {
            window.ViewerLoader.hide('#file-content');
          }
        });
    }

    function resolveRelativePath(filePath, relativeUrl) {
      if (!relativeUrl || /^(https?:|data:|\/\/)/i.test(relativeUrl)) {
        return relativeUrl;
      }
      const baseParts = filePath.includes('/')
        ? filePath.slice(0, filePath.lastIndexOf('/')).split('/').filter((s) => s !== '')
        : [];
      const resolved = [...baseParts];
      for (const seg of relativeUrl.split('/')) {
        if (!seg || seg === '.') continue;
        if (seg === '..') {
          if (resolved.length && resolved[resolved.length - 1] !== '..') {
            resolved.pop();
          } else {
            resolved.push('..');
          }
        } else {
          resolved.push(seg);
        }
      }
      return resolved.join('/');
    }

    function toAssetUrl(href, filePath) {
      if (!href || /^(https?:|data:|\/\/)/i.test(href)) {
        return href;
      }
      const resolved = resolveRelativePath(filePath, href);
      return `${API_BASE_URL}/asset?root=${encodeURIComponent(resolved)}`;
    }

    function toViewerHref(resolvedPath, hash) {
      let href = window.location.pathname + '?path=' + encodeViewerPath(resolvedPath);
      if (hash) {
        href += '#' + String(hash).replace(/^#/, '');
      }
      return href;
    }

    function toInternalLinkHref(href, filePath) {
      if (!href || /^(https?:|mailto:|tel:|data:|\/\/)/i.test(href)) {
        return href;
      }
      if (href.charAt(0) === '#') {
        return href;
      }

      let pathPart = href;
      let hash = '';
      const hashIdx = href.indexOf('#');
      if (hashIdx >= 0) {
        pathPart = href.slice(0, hashIdx);
        hash = href.slice(hashIdx + 1);
      }
      if (!pathPart) {
        return hash ? '#' + hash : href;
      }

      const resolved = pathPart.charAt(0) === '/'
        ? pathPart.replace(/^\/+/, '')
        : resolveRelativePath(filePath, pathPart);
      return toViewerHref(resolved, hash);
    }

    function renderFileContent(fileContent, filePath) {
      const fileContentElement = document.getElementById('file-content');
      if (!fileContent) {
        showEmptyFileContent();
        return;
      }
      setReaderMode(false);

      // Extension -> highlight.js language for raw source files (no Markdown)
      const codeExtensions = {
        '.java': 'java',
        '.js': 'javascript',
        '.ts': 'typescript',
        '.py': 'python',
        '.go': 'go',
        '.rs': 'rust',
        '.c': 'c',
        '.cpp': 'cpp',
        '.cs': 'csharp',
        '.rb': 'ruby',
        '.php': 'php',
        '.swift': 'swift',
        '.kt': 'kotlin',
        '.scala': 'scala',
        '.sql': 'sql',
        '.sh': 'bash',
        '.bash': 'bash',
        '.yaml': 'yaml',
        '.yml': 'yaml',
        '.json': 'json',
        '.xml': 'xml',
        '.html': 'html',
        '.css': 'css'
      };

      const ext = filePath.includes('.') ? '.' + filePath.split('.').pop().toLowerCase() : '';
      const language = codeExtensions[ext];

      if (language) {
        // Raw source file: render as a single code block (no Markdown)
        const escaped = escapeHtmlAttr(fileContent);
        fileContentElement.innerHTML = `<pre><code class="language-${language}">${escaped}</code></pre>`;
      } else {
        fileContentElement.innerHTML = renderMarkdownToHtml(fileContent, filePath);
      }

      applyContentEnhancements(fileContentElement);
      updateReadingTime(fileContent);
    }
  </script>
