<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <!-- Highlight.js for syntax highlighting (dark + light) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    id="hljs-dark" media="all">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    id="hljs-light" media="none">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- GitHub Markdown CSS (dark + light) -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css"
    id="markdown-dark" media="all">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css"
    id="markdown-light" media="none">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script>
    tailwind.config = {
      // Enable class-based dark mode
      darkMode: 'class'
    }
  </script>
  <style>
    /* Ensure html/body background follows theme (Tailwind class applies on html) */
    html {
      background-color: #fff;
      color: #000;
    }

    html.dark {
      background-color: #111827;
      color: #e5e7eb;
    }

    body {
      background-color: inherit;
      color: inherit;
      /* overflow-x: hidden; */
    }

    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0;
      /* margin: 0 auto; */
      padding: 45px;
      background-color: #fff;
    }

    html.dark .markdown-body {
      background-color: #0d1117;
    }

    .markdown-body ol,
    .markdown-body ul {
      list-style: auto;
    }

    @media (max-width: 767px) {
      .markdown-body {
        padding: 15px;
      }
    }

    .toc-sidebar,
    .right-sidebar {
      position: sticky;
      top: 1rem;
      max-height: calc(100vh - 2rem);
      overflow-y: auto;
    }

    .right-sidebar {
      font-size: 12px;
      height: calc(100vh - 2rem);
    }

    .toc-sidebar a {
      display: block;
      padding: 0.25rem 0;
      font-size: 0.875rem;
      color: inherit;
      text-decoration: none;
      border-left: 2px solid transparent;
      padding-left: 0.5rem;
      margin-left: 0;
    }

    .toc-sidebar a:hover {
      color: #2563eb;
    }

    html.dark .toc-sidebar a:hover {
      color: #60a5fa;
    }

    .toc-sidebar .toc-h2 {
      margin-left: 0;
    }

    .toc-sidebar .toc-h3 {
      margin-left: 0.75rem;
    }

    .toc-sidebar .toc-h4 {
      margin-left: 1.5rem;
    }

    .toc-sidebar .toc-h5 {
      margin-left: 2.25rem;
    }

    .toc-sidebar .toc-h6 {
      margin-left: 3rem;
    }

    html {
      scroll-behavior: smooth;
    }

    @media print {
      /* @media screen,
    print { */

      ol,
      ul {
        line-height: 1.2;
      }

      .no-print,
      #toc-sidebar {
        display: none !important;
        /* Hide elements in print */
      }

      html,
      body {
        background: #fff !important;
        color: #000 !important;
        line-height: 1 !important;
      }

      .markdown-body {
        background-color: #fff !important;
        color: #000 !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .markdown-body a {
        color: #0550ae !important;
      }

      .markdown-body pre,
      .markdown-body code,
      .markdown-body .hljs {
        border: 1px solid #e1e4e8;
      }

      pre,
      code {
        color: #000 !important;
        background: transparent !important;
        border: none !important;
      }

      .container a,
      .container h1 {
        color: #000 !important;
      }

      #directories-list li {
        color: #000 !important;
      }

      p,
      hr,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        margin: 0 !important;
      }

      body.two-column-print .markdown-body {
        column-count: 2;
        column-gap: 0;
        /* column-gap: 2rem; */
      }

      body.two-column-print h1 {
        font-size: 1.25rem !important;
      }
    }
  </style>
</head>

<body>
  <div class="w-full max-w-full px-4 py-4 box-border">
    <div class="flex gap-6">
      <aside id="toc-sidebar" class="toc-sidebar w-48 shrink-0 no-print hidden"></aside>
      <main class="flex-1 min-w-0 w-full">
        <div class="no-print flex justify-between items-center">
          <a href="/" class="text-blue-600 dark:text-blue-400">
            <h1 class="text-2xl font-bold">Viewer</h1>
          </a>
        </div>
        <div id="file-content" class="markdown-body mt-6"></div>
      </main>
      <aside class="right-sidebar w-48 shrink-0 no-print flex flex-col">
        <label for="directories-list" class="font-medium text-gray-700 dark:text-gray-400 shrink-0">File
          Explorer</label>
        <ol id="directories-list" class="list-decimal list-inside no-print"></ol>
        <i class="mt-auto"></i>

        <div class="flex flex-col gap-2 mt-2">
          <label for="is-two-column-print" class="font-medium text-gray-700 dark:text-gray-300 shrink-0">
            <input type="checkbox" id="is-two-column-print" class="px-2 py-1 rounded border transition-colors"
              placeholder="Is Two Column Print">
            Is Two Column Print</label>
          <div>
            <button type="button" id="btn-dark"
              class="px-2 py-1 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">Dark</button>
            <button type="button" id="btn-light"
              class="px-2 py-1 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">Light</button>
          </div>
        </div>
        <i class="mt-auto"></i>
        <div id="voice-controller" class="mt-6 no-print flex flex-wrap items-center gap-2 justify-start">
          <label for="voice-select" class="font-medium text-gray-700 dark:text-gray-400 shrink-0">Voice</label>
          <select id="voice-select"
            class="px-2 py-1 text-sm rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:ring-blue-400 dark:focus:border-blue-400 outline-none transition-colors"
            style="width: stretch;">
            <option value="">Select voice…</option>
            <option value="default">Default</option>
          </select>
          <label
            class="w-full flex items-center gap-1.5 cursor-pointer select-none text-gray-700 dark:text-gray-300 shrink-0">
            <input type="checkbox" id="skip-code-blocks"
              class="rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 dark:bg-gray-800">
            <span>Skip code blocks</span>
          </label>
          <button type="button" id="btn-play" title="Play"
            class="p-2 rounded text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7L8 5z" />
            </svg>
          </button>
          <button type="button" id="btn-pause" title="Pause"
            class="p-2 rounded text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>
          <button type="button" id="btn-resume" title="Resume"
            class="p-2 rounded text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z" />
            </svg>
          </button>
          <button type="button" id="btn-stop" title="Stop"
            class="p-2 rounded text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6h12v12H6z" />
            </svg>
          </button>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const THEME_KEY = 'viewer-theme';
    const THEME_DARK = 'dark';
    const THEME_LIGHT = 'light';
    const htmlElement = document.documentElement;
    // Voice
    const VOICE_STORAGE_KEY = 'viewer-voice';
    const SKIP_CODE_BLOCKS_KEY = 'viewer-skip-code-blocks';
    const TWO_COLUMN_PRINT_KEY = 'viewer-two-column-print';
    const voiceSelect = document.getElementById('voice-select');
    const btnPlay = document.getElementById('btn-play');
    const btnPause = document.getElementById('btn-pause');
    const btnResume = document.getElementById('btn-resume');
    const btnStop = document.getElementById('btn-stop');
    const skipCodeBlocksCheckbox = document.getElementById('skip-code-blocks');
    const twoColumnPrintCheckbox = document.getElementById('is-two-column-print');
    const codeblockAlternativeText = "See the code block for more details.";
    let voiceControllerContent = "";

    let directories = [];
    let currentRootDirectory = '';

    init();
    initTheme();
    initVoiceController();
    initTwoColumnPrint();


    function init() {
      // Read path from URL on page load
      const urlParams = new URLSearchParams(window.location.search);
      const pathFromUrl = urlParams.get('path') || '';
      currentRootDirectory = pathFromUrl;

      getDirectories(currentRootDirectory);

      // Set up event delegation for click handling
      const directoriesList = document.getElementById('directories-list');
      directoriesList.addEventListener('click', (e) => {
        if (e.target.tagName === 'LI' && e.target.dataset.directory) {
          handleDirectoryClick(e.target.dataset.directory);
        }
      });

      // Handle browser back/forward buttons
      window.addEventListener('popstate', (e) => {
        const urlParams = new URLSearchParams(window.location.search);
        const pathFromUrl = urlParams.get('path') || '';
        currentRootDirectory = pathFromUrl;
        getDirectories(currentRootDirectory);
      });
    }

    function initTheme() {
      // On page load, resolve theme from localStorage or system preference
      const saved = localStorage.getItem(THEME_KEY);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialMode = saved === THEME_DARK || saved === THEME_LIGHT
        ? saved
        : (prefersDark ? THEME_DARK : THEME_LIGHT);
      applyTheme(initialMode);

      document.getElementById('btn-dark').addEventListener('click', () => applyTheme(THEME_DARK));
      document.getElementById('btn-light').addEventListener('click', () => applyTheme(THEME_LIGHT));
    }

    function initTwoColumnPrint() {
      if (!twoColumnPrintCheckbox) return;
      const saved = localStorage.getItem(TWO_COLUMN_PRINT_KEY);
      const enabled = saved === 'true';
      twoColumnPrintCheckbox.checked = enabled;
      updateTwoColumnPrintClass(enabled);

      twoColumnPrintCheckbox.addEventListener('change', () => {
        const isChecked = twoColumnPrintCheckbox.checked;
        localStorage.setItem(TWO_COLUMN_PRINT_KEY, String(isChecked));
        updateTwoColumnPrintClass(isChecked);
      });
    }

    function updateTwoColumnPrintClass(enabled) {
      document.body.classList.toggle('two-column-print', enabled);
    }
    function applyTheme(mode) {
      // Toggle the 'dark' class on the <html> element
      if (mode === THEME_DARK) {
        htmlElement.classList.add(THEME_DARK);
        htmlElement.classList.remove(THEME_LIGHT);
        localStorage.setItem(THEME_KEY, THEME_DARK);
      } else {
        htmlElement.classList.remove(THEME_DARK);
        htmlElement.classList.add(THEME_LIGHT);
        localStorage.setItem(THEME_KEY, THEME_LIGHT);
      }

      // Toggle stylesheets (highlight.js + markdown) to match theme
      const isDark = mode === THEME_DARK;
      document.getElementById('hljs-dark').media = isDark ? 'all' : 'none';
      document.getElementById('hljs-light').media = isDark ? 'none' : 'all';
      document.getElementById('markdown-dark').media = isDark ? 'all' : 'none';
      document.getElementById('markdown-light').media = isDark ? 'none' : 'all';
    }


    function initVoiceController() {

      function populateVoices() {
        const voices = speechSynthesis.getVoices();
        const englishVoices = voices.filter(v => v.lang.startsWith('en'));
        voiceSelect.innerHTML = '<option value="">Select voice…</option>' +
          englishVoices.map(v => `<option value="${escapeHtmlAttr(v.name)}">${escapeHtmlAttr(v.name)} (${escapeHtmlAttr(v.lang)})</option>`).join('');

        const saved = localStorage.getItem(VOICE_STORAGE_KEY);
        if (saved && [...voiceSelect.options].some(o => o.value === saved)) {
          voiceSelect.value = saved;
        }
      }

      function escapeHtmlAttr(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      if (speechSynthesis.getVoices().length) {
        populateVoices();
      } else {
        speechSynthesis.addEventListener('voiceschanged', populateVoices);
      }

      voiceSelect.addEventListener('change', () => {
        const value = voiceSelect.value;
        if (value) localStorage.setItem(VOICE_STORAGE_KEY, value);
      });

      const savedSkipCode = localStorage.getItem(SKIP_CODE_BLOCKS_KEY);
      if (skipCodeBlocksCheckbox) {
        skipCodeBlocksCheckbox.checked = savedSkipCode === 'true';
        skipCodeBlocksCheckbox.addEventListener('change', () => {
          localStorage.setItem(SKIP_CODE_BLOCKS_KEY, String(skipCodeBlocksCheckbox.checked));
        });
      }

      btnPlay.addEventListener('click', () => {
        const text = getSpeakableContent().trim();
        if (!text) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const voices = speechSynthesis.getVoices();
        const chosen = voiceSelect.value && voices.find(v => v.name === voiceSelect.value);
        if (chosen) u.voice = chosen;
        u.lang = 'en';
        speechSynthesis.speak(u);
      });

      btnPause.addEventListener('click', () => {
        if (speechSynthesis.speaking) speechSynthesis.pause();
      });

      btnResume.addEventListener('click', () => {
        // if (speechSynthesis.paused) speechSynthesis.resume();
        speechSynthesis.resume();
      });

      btnStop.addEventListener('click', () => {
        speechSynthesis.cancel();
      });
    }

    function getSpeakableContent() {
      const el = document.getElementById('file-content');
      if (!el) return '';
      if (skipCodeBlocksCheckbox && skipCodeBlocksCheckbox.checked) {
        const clone = el.cloneNode(true);
        // clone.querySelectorAll('pre').forEach((pre) => pre.remove());
        clone.querySelectorAll('pre').forEach((pre) => {
          pre.innerText = codeblockAlternativeText;
        });
        return clone.innerText || '';
      }
      return el.innerText || '';
    }

    function updateUrl(path) {
      // Build URL with readable path: encode only &, =, % so slashes stay as /
      let newUrl = window.location.origin + window.location.pathname;
      if (path) {
        const safePath = path.replace(/%/g, '%25').replace(/&/g, '%26').replace(/=/g, '%3D');
        newUrl += '?path=' + safePath;
      }
      window.history.pushState({ path }, '', newUrl);
    }

    function getDirectories(root = '') {
      const url = root ? `/api/directories?root=${encodeURIComponent(root)}` : '/api/directories';
      fetch(url)
        .then(response => response.json())
        .then(data => {
          console.log(data);
          // const directories = root ? ['..', ...data] : data;
          const directories = ['..', ...data.list];
          renderDirectories(directories);
          if (data.fileContent) {
            renderFileContent(data.fileContent, url);
          } else {
            document.getElementById('file-content').innerHTML = '';
            buildTableOfContents(null);
          }
        })
        .catch(error => {
          console.error('Error fetching directories:', error);
        });
    }
    function renderDirectories(directories) {
      const directoriesList = document.getElementById('directories-list');
      directoriesList.innerHTML = directories.map(directory => {
        const isParent = directory === '..';
        const displayName = isParent ? '.. (go back)' : directory;
        // Escape HTML for data attribute
        const escapedDirectory = directory.replace(/"/g, '&quot;');
        return `<li class="cursor-pointer hover:text-blue-600 dark:hover:text-blue-400 hover:underline py-1 text-inherit" data-directory="${escapedDirectory}">${displayName}</li>`;
      }).join('');
    }
    function handleDirectoryClick(directory) {
      console.log('handleDirectoryClick', directory);
      if (directory === '..') {
        // Go back to parent directory
        if (currentRootDirectory === '') {
          // At root, navigate to parent directory
          currentRootDirectory = '..';
        } else {
          // Remove the last path segment or add another '..'
          const pathParts = currentRootDirectory.split('/').filter(p => p);
          console.log('pathParts', pathParts);
          if (pathParts.length > 0 && pathParts[pathParts.length - 1] !== '..') {
            // Remove the last path segment if it's not '..'
            pathParts.pop();
            currentRootDirectory = pathParts.length > 0 ? pathParts.join('/') : '';
          } else {
            // Add another '..' to go further up
            currentRootDirectory = currentRootDirectory ? `${currentRootDirectory}/..` : '..';
          }
        }
      } else {
        // Navigate into the selected directory
        currentRootDirectory = currentRootDirectory
          ? `${currentRootDirectory}/${directory}`
          : directory;
      }
      // Update URL with new path
      updateUrl(currentRootDirectory);
      getDirectories(currentRootDirectory);
    }
    function renderDirectory(directory) {
      const directoryItem = document.createElement('div');
      directoryItem.classList.add('directory-item');
      directoryItem.innerHTML = `<a href="/${directory}">${directory}</a>`;
      return directoryItem;
    }

    function buildTableOfContents(contentEl) {
      const tocSidebar = document.getElementById('toc-sidebar');
      if (!tocSidebar) return;
      const headings = contentEl ? contentEl.querySelectorAll('h1, h2, h3, h4, h5, h6') : [];
      if (headings.length === 0) {
        tocSidebar.innerHTML = '';
        tocSidebar.classList.add('hidden');
        return;
      }
      const nav = document.createElement('nav');
      nav.setAttribute('aria-label', 'Table of contents');
      headings.forEach((h) => {
        const id = h.id || slugify(h.textContent);
        if (!h.id) h.id = id;
        const a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = h.textContent;
        a.classList.add('toc-' + h.tagName.toLowerCase());
        a.addEventListener('click', (e) => {
          e.preventDefault();
          document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
          history.replaceState(null, '', window.location.pathname + window.location.search + '#' + id);
        });
        nav.appendChild(a);
      });
      const title = document.createElement('div');
      title.className = 'font-semibold text-sm mb-2 text-gray-700 dark:text-gray-300';
      title.textContent = 'Table of Contents';
      tocSidebar.innerHTML = '';
      tocSidebar.appendChild(title);
      tocSidebar.appendChild(nav);
      tocSidebar.classList.remove('hidden');
    }

    function slugify(text) {
      return String(text || '')
        .trim()
        .toLowerCase()
        .replace(/\s+/g, '-')
        .replace(/[^\w-]+/g, '')
        .replace(/--+/g, '-')
        .replace(/^-|-$/g, '') || 'section';
    }

    function renderFileContent(fileContent, url) {
      const fileContentElement = document.getElementById('file-content');
      if (!fileContent) {
        fileContentElement.innerHTML = '';
        voiceControllerContent = '';
        return;
      }

      // Extension -> highlight.js language for raw source files (no Markdown)
      const codeExtensions = {
        '.java': 'java',
        '.js': 'javascript',
        '.ts': 'typescript',
        '.py': 'python',
        '.go': 'go',
        '.rs': 'rust',
        '.c': 'c',
        '.cpp': 'cpp',
        '.cs': 'csharp',
        '.rb': 'ruby',
        '.php': 'php',
        '.swift': 'swift',
        '.kt': 'kotlin',
        '.scala': 'scala',
        '.sql': 'sql',
        '.sh': 'bash',
        '.bash': 'bash',
        '.yaml': 'yaml',
        '.yml': 'yaml',
        '.json': 'json',
        '.xml': 'xml',
        '.html': 'html',
        '.css': 'css'
      };

      const ext = url.includes('.') ? '.' + url.split('.').pop().toLowerCase() : '';
      const language = codeExtensions[ext];

      if (language) {
        // Raw source file: render as a single code block (no Markdown)
        const escaped = fileContent
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
        fileContentElement.innerHTML = `<pre><code class="language-${language}">${escaped}</code></pre>`;
      } else {
        // Markdown or unknown: parse as Markdown
        const renderer = new marked.Renderer();
        renderer.code = function (code, lang) {
          const langClass = lang ? ` class="language-${lang}"` : '';
          return `<pre><code${langClass}>${code}</code></pre>`;
        };
        marked.setOptions({
          breaks: true,
          gfm: true,
          headerIds: true,
          mangle: false,
          renderer: renderer
        });
        fileContentElement.innerHTML = marked.parse(fileContent);
      }

      voiceControllerContent = fileContentElement.innerText || '';

      buildTableOfContents(fileContentElement);

      // Scroll to hash if present in URL (e.g. after refresh or direct link)
      if (window.location.hash) {
        const id = window.location.hash.slice(1);
        setTimeout(() => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' }), 100);
      }

      // Highlight all code blocks using highlight.js
      // Use setTimeout to ensure DOM is ready
      setTimeout(() => {
        if (typeof hljs !== 'undefined' && hljs.highlightElement) {
          fileContentElement.querySelectorAll('pre code').forEach((block) => {
            try {
              // Remove any existing highlight classes to avoid conflicts
              block.classList.remove('hljs');
              // Highlight the code block
              hljs.highlightElement(block);
            } catch (err) {
              console.error('Error highlighting code block:', err);
            }
          });
        } else {
          console.error('Highlight.js is not loaded');
        }
      }, 0);
    }
  </script>

</body>

</html>
