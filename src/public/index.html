<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewer</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <!-- Highlight.js for syntax highlighting (dark + light) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    id="hljs-dark" media="all">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    id="hljs-light" media="none">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- GitHub Markdown CSS (dark + light) -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css"
    id="markdown-dark" media="all">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css"
    id="markdown-light" media="none">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script>
    tailwind.config = {
      // Enable class-based dark mode
      darkMode: 'class'
    }
  </script>
  <style>
    /* Ensure html/body background follows theme (Tailwind class applies on html) */
    html {
      background-color: #fff;
      color: #000;
      scroll-behavior: smooth;
    }

    html.dark {
      background-color: #111827;
      color: #e5e7eb;
    }

    body {
      background-color: inherit;
      color: inherit;
      overflow-x: hidden;
    }

    body.drawer-open {
      overflow: hidden;
    }

    .app-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: inherit;
    }

    .app-brand-logo {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      object-fit: contain;
    }

    @media (min-width: 1024px) {
      .app-brand-logo {
        width: 32px;
        height: 32px;
      }
    }

    .panel-drawer {
      transition: transform 0.2s ease-out;
    }

    @media (max-width: 1023px) {
      .panel-drawer {
        overflow-y: auto;
        max-height: 100vh;
      }

      .panel-drawer-left {
        transform: translateX(-100%);
      }

      .panel-drawer-right {
        transform: translateX(100%);
      }

      .panel-drawer.panel-open {
        transform: translateX(0);
      }
    }

    @media (min-width: 1024px) {
      .panel-drawer {
        transform: none !important;
      }

      .toc-sidebar,
      .right-sidebar {
        position: sticky;
        top: 1rem;
        max-height: calc(100vh - 2rem);
        overflow-y: auto;
        font-size: 12px;
      }

      .right-sidebar {
        height: calc(100vh - 2rem);
      }
    }

    .toc-sidebar a {
      display: block;
      padding: 0.25rem 0;
      color: inherit;
      text-decoration: none;
      border-left: 2px solid transparent;
      padding-left: 0.5rem;
      margin-left: 0;
      font-size: 12px;
    }

    .toc-sidebar a:hover {
      color: #2563eb;
    }

    html.dark .toc-sidebar a:hover {
      color: #60a5fa;
    }

    .toc-sidebar .toc-h2 {
      margin-left: 0;
    }

    .toc-sidebar .toc-h3 {
      margin-left: 0.75rem;
    }

    .toc-sidebar .toc-h4 {
      margin-left: 1.5rem;
    }

    .toc-sidebar .toc-h5 {
      margin-left: 2.25rem;
    }

    .toc-sidebar .toc-h6 {
      margin-left: 3rem;
    }

    .explorer-list {
      list-style: decimal;
      list-style-position: inside;
      margin: 0;
      padding: 0;
    }

    .explorer-tree {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .explorer-tree .explorer-tree {
      padding-left: 0.75rem;
    }

    .explorer-tree-item {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      max-width: 100%;
      padding: 0.15rem 0;
      cursor: pointer;
      color: inherit;
    }

    .explorer-tree-item:hover .explorer-tree-label {
      color: #2563eb;
      text-decoration: underline;
    }

    html.dark .explorer-tree-item:hover .explorer-tree-label {
      color: #60a5fa;
    }

    .explorer-tree-item.is-active .explorer-tree-label {
      font-weight: 600;
      color: #2563eb;
    }

    html.dark .explorer-tree-item.is-active .explorer-tree-label {
      color: #60a5fa;
    }

    .explorer-tree-chevron {
      flex-shrink: 0;
      width: 1rem;
      height: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      line-height: 1;
      color: #6b7280;
      user-select: none;
    }

    html.dark .explorer-tree-chevron {
      color: #9ca3af;
    }

    .explorer-tree-spacer {
      flex-shrink: 0;
      width: 1rem;
    }

    .explorer-tree-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .explorer-mode-active {
      background-color: #e5e7eb !important;
      border-color: #9ca3af !important;
    }

    html.dark .explorer-mode-active {
      background-color: #374151 !important;
      border-color: #6b7280 !important;
    }


    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0;
      /* margin: 0 auto; */
      padding: 45px;
      background-color: #fff;
    }

    html.dark .markdown-body {
      background-color: #0d1117;
    }

    .markdown-body ol,
    .markdown-body ul {
      list-style: auto;
    }

    @media (max-width: 1023px) {
      .markdown-body {
        max-width: 100%;
        padding: 12px 16px;
      }
    }

    .markdown-body pre,
    .markdown-body table {
      overflow-x: auto;
      max-width: 100%;
    }

    .markdown-body h1 {
      color: #00b000;
    }

    .markdown-body h2 {
      color: #00a000;
    }

    .markdown-body h3 {
      color: #009000;
    }

    /* Per-heading play control: appears on heading hover / focus-within */
    .markdown-body h1.md-heading-with-play,
    .markdown-body h2.md-heading-with-play,
    .markdown-body h3.md-heading-with-play,
    .markdown-body h4.md-heading-with-play,
    .markdown-body h5.md-heading-with-play,
    .markdown-body h6.md-heading-with-play {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.35rem 0.5rem;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .markdown-body .md-heading-text {
      min-width: 0;
      flex: 1 1 auto;
    }

    .markdown-body .md-heading-actions {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      gap: 0.25rem;
      margin-top: 0.15em;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .markdown-body h1.md-heading-with-play:hover .md-heading-actions,
    .markdown-body h2.md-heading-with-play:hover .md-heading-actions,
    .markdown-body h3.md-heading-with-play:hover .md-heading-actions,
    .markdown-body h4.md-heading-with-play:hover .md-heading-actions,
    .markdown-body h5.md-heading-with-play:hover .md-heading-actions,
    .markdown-body h6.md-heading-with-play:hover .md-heading-actions,
    .markdown-body h1.md-heading-with-play:focus-within .md-heading-actions,
    .markdown-body h2.md-heading-with-play:focus-within .md-heading-actions,
    .markdown-body h3.md-heading-with-play:focus-within .md-heading-actions,
    .markdown-body h4.md-heading-with-play:focus-within .md-heading-actions,
    .markdown-body h5.md-heading-with-play:focus-within .md-heading-actions,
    .markdown-body h6.md-heading-with-play:focus-within .md-heading-actions {
      opacity: 1;
    }

    /* Touch / no-hover: keep control discoverable (primary interaction is still tap) */
    @media (hover: none) {
      .markdown-body .md-heading-actions {
        opacity: 0.55;
      }
    }

    @media print {
      /* @media screen,
    print { */

      html,
      body {
        background: #fff !important;
        color: #000 !important;
        line-height: 1 !important;
      }

      ol,
      ul {
        line-height: 1.2;
      }

      .no-print,
      #toc-sidebar,
      #controls-sidebar,
      #mobile-header,
      #panel-backdrop {
        display: none !important;
        /* Hide elements in print */
      }

      pre,
      code {
        color: #000 !important;
        background: transparent !important;
        border: none !important;
      }

      .container a,
      .container h1 {
        color: #000 !important;
      }

      #directories-list li {
        color: #000 !important;
      }

      #directories-list .explorer-tree-item {
        color: #000 !important;
      }

      p,
      hr,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        margin: 0 !important;
      }


      .markdown-body {
        background-color: #fff !important;
        color: #000 !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .markdown-body a {
        color: #0550ae !important;
      }

      .markdown-body pre,
      .markdown-body code,
      .markdown-body .hljs {
        border: 1px solid #e1e4e8;
      }


      body.two-column-print .markdown-body {
        column-count: 2;
        column-gap: 0;
        /* column-gap: 2rem; */
      }

      body.two-column-print h1 {
        font-size: 1.25rem !important;
      }
    }
  </style>
</head>

<body>
  <div id="panel-backdrop" class="fixed inset-0 z-40 bg-black/40 hidden lg:hidden no-print" aria-hidden="true"></div>
  <div class="w-full max-w-full px-3 sm:px-4 py-4 box-border">
    <div class="flex flex-col lg:flex-row lg:gap-6">
      <aside id="toc-sidebar"
        class="panel-drawer panel-drawer-left toc-sidebar no-print hidden fixed inset-y-0 left-0 z-50 w-[min(85vw,18rem)] p-4 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-700 shadow-lg lg:static lg:inset-auto lg:z-auto lg:w-48 lg:shrink-0 lg:p-0 lg:shadow-none lg:border-0">
      </aside>
      <main class="flex-1 min-w-0 w-full">
        <header id="mobile-header"
          class="no-print lg:hidden sticky top-0 z-30 -mx-3 sm:-mx-4 px-3 sm:px-4 py-2 mb-2 flex items-center justify-between gap-2 border-b border-gray-200 dark:border-gray-700 bg-inherit">
          <a href="/" class="app-brand text-blue-600 dark:text-blue-400 min-h-11 shrink-0">
            <img src="favicon-32x32.png" alt="" width="32" height="32" class="app-brand-logo" aria-hidden="true">
            <span class="text-xl font-bold leading-none">Viewer</span>
          </a>
          <div class="flex items-center gap-1 shrink-0">
            <button type="button" id="btn-mobile-toc" aria-expanded="false" aria-controls="toc-sidebar"
              aria-label="Open table of contents"
              class="min-h-11 px-3 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">Contents</button>
            <button type="button" id="btn-mobile-menu" aria-expanded="false" aria-controls="controls-sidebar"
              aria-label="Open menu"
              class="min-h-11 px-3 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">Menu</button>
          </div>
        </header>
        <div class="no-print hidden lg:flex justify-between items-center">
          <a href="/" class="app-brand text-blue-600 dark:text-blue-400">
            <img src="favicon-32x32.png" alt="" width="32" height="32" class="app-brand-logo" aria-hidden="true">
            <h1 class="text-2xl font-bold leading-none m-0">Viewer</h1>
          </a>
        </div>
        <div id="file-content" class="markdown-body mt-4 lg:mt-6">
          <p class="file-content-empty text-center text-gray-500 dark:text-gray-400 py-8 lg:py-12">
            Select a file from the File Explorer to view its contents.
          </p>
        </div>
      </main>
      <aside id="controls-sidebar"
        class="panel-drawer panel-drawer-right right-sidebar no-print flex flex-col fixed inset-y-0 right-0 z-50 w-[min(85vw,18rem)] p-4 bg-white dark:bg-gray-900 border-l border-gray-200 dark:border-gray-700 shadow-lg lg:static lg:inset-auto lg:z-auto lg:w-56 lg:shrink-0 lg:p-0 lg:shadow-none lg:border-0">
        <label for="directories-list" class="font-medium text-gray-700 dark:text-gray-400 shrink-0">File
          Explorer</label>
        <div class="mt-1 mb-1 flex flex-wrap gap-1 no-print" role="toolbar" aria-label="File explorer controls">
          <button type="button" id="btn-explorer-list" title="List view" aria-label="List view"
            class="p-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
              aria-hidden="true">
              <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <button type="button" id="btn-explorer-tree" title="Tree view" aria-label="Tree view"
            class="p-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
              aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h6M4 12h6M4 18h6M14 6v12M14 12h6" />
            </svg>
          </button>
          <button type="button" id="btn-expand-all" title="Expand all" aria-label="Expand all"
            class="p-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors hidden">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
              aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 8l8-5 8 5M4 16l8 5 8-5M4 12h16" />
            </svg>
          </button>
          <button type="button" id="btn-collapse-all" title="Collapse all" aria-label="Collapse all"
            class="p-2 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors hidden">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
              aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 8l8 5 8-5M4 16l8-5 8 5" />
            </svg>
          </button>
        </div>
        <p id="explorer-error" class="mt-1 text-sm text-red-600 dark:text-red-400 hidden no-print" role="alert"></p>
        <div id="directories-list" class="no-print overflow-x-auto"></div>
        <i class="mt-auto"></i>

        <div class="flex flex-col gap-2 mt-2">
          <label for="is-two-column-print"
            class="w-full flex items-center gap-1.5 cursor-pointer select-none text-gray-700 dark:text-gray-300 shrink-0">
            <input type="checkbox" id="is-two-column-print"
              class="rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 dark:bg-gray-800">
            <span>Is Two Column Print</span>
          </label>
          <div>
            <button type="button" id="btn-dark"
              class="px-2 py-1 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">Dark</button>
            <button type="button" id="btn-light"
              class="px-2 py-1 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">Light</button>
          </div>
        </div>
        <div class="mt-4">
          <p class="font-medium text-gray-700 dark:text-gray-400">Toggle tags</p>
          <div id="tag-toggle-controls" class="mt-1 flex flex-col gap-1"></div>
        </div>
        <i class="mt-auto"></i>
        <div id="voice-controller" class="mt-6 no-print flex flex-wrap items-center gap-2 justify-start">
          <label for="voice-select" class="font-medium text-gray-700 dark:text-gray-400 shrink-0">Voice</label>
          <select id="voice-select"
            class="px-2 py-1 text-sm rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:ring-blue-400 dark:focus:border-blue-400 outline-none transition-colors"
            style="width: stretch;">
            <option value="">Select voice…</option>
            <option value="default">Default</option>
          </select>
          <label
            class="w-full flex items-center gap-1.5 cursor-pointer select-none text-gray-700 dark:text-gray-300 shrink-0">
            <input type="checkbox" id="skip-code-blocks"
              class="rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 dark:bg-gray-800">
            <span>Skip code blocks</span>
          </label>
          <div class="w-full flex flex-col gap-1.5 mt-1">
            <div class="flex items-center justify-between gap-2">
              <label for="speech-rate" class="font-medium text-gray-700 dark:text-gray-400 text-xs shrink-0">Speech
                rate</label>
              <span id="speech-rate-value"
                class="text-xs tabular-nums text-gray-600 dark:text-gray-400 shrink-0">1.0×</span>
            </div>
            <input type="range" id="speech-rate" min="0.5" max="2" step="0.1" value="1"
              class="w-full h-2 rounded-lg appearance-none bg-gray-200 dark:bg-gray-600 accent-blue-600 dark:accent-blue-500 cursor-pointer">
            <div class="flex justify-between text-[10px] text-gray-500 dark:text-gray-400 leading-none">
              <span>Slower</span>
              <span>Faster</span>
            </div>
          </div>
          <button type="button" id="btn-play" title="Play"
            class="p-2 rounded text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7L8 5z" />
            </svg>
          </button>
          <button type="button" id="btn-pause" title="Pause"
            class="p-2 rounded text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>
          <button type="button" id="btn-resume" title="Resume"
            class="p-2 rounded text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7L8 5z" />
              <circle cx="18" cy="4" r="2" />
            </svg>
          </button>
          <button type="button" id="btn-stop" title="Stop"
            class="p-2 rounded text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6h12v12H6z" />
            </svg>
          </button>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // To deploy in a root path, use this URL
    const API_BASE_URL = '/api';
    // To deploy in a subpath, use this URL
    // const API_BASE_URL = '/viewer/api';
    const THEME_KEY = 'viewer-theme';
    const THEME_DARK = 'dark';
    const THEME_LIGHT = 'light';
    const htmlElement = document.documentElement;
    const TAGS_TO_TOGGLE = [
      {
        tag: 'blockquote',
        label: 'Blockquote'
      }
    ];
    const TAG_TOGGLE_STORAGE_KEY = 'viewer-tag-toggles';
    const tagToggleContainer = document.getElementById('tag-toggle-controls');
    // Voice
    const VOICE_STORAGE_KEY = 'viewer-voice';
    const SKIP_CODE_BLOCKS_KEY = 'viewer-skip-code-blocks';
    const SPEECH_RATE_KEY = 'viewer-speech-rate';
    const SPEECH_RATE_MIN = 0.5;
    const SPEECH_RATE_MAX = 2;
    const TWO_COLUMN_PRINT_KEY = 'viewer-two-column-print';
    const voiceSelect = document.getElementById('voice-select');
    const speechRateInput = document.getElementById('speech-rate');
    const speechRateValueEl = document.getElementById('speech-rate-value');
    const btnPlay = document.getElementById('btn-play');
    const btnPause = document.getElementById('btn-pause');
    const btnResume = document.getElementById('btn-resume');
    const btnStop = document.getElementById('btn-stop');
    const skipCodeBlocksCheckbox = document.getElementById('skip-code-blocks');
    const twoColumnPrintCheckbox = document.getElementById('is-two-column-print');
    const codeblockAlternativeText = "See the code block for more details.";
    let voiceControllerContent = "";

    let directories = [];
    let currentRootDirectory = '';
    let viewingFile = false;
    let closeMobilePanels = () => { };
    const EXPLORER_VIEW_KEY = 'explorerViewMode';
    let explorerViewMode = localStorage.getItem(EXPLORER_VIEW_KEY) === 'tree' ? 'tree' : 'list';
    let treeData = [];
    let treeBase = '';
    let expandedPaths = new Set();
    let activeTreePath = null;

    function clampSpeechRate(n) {
      const x = Number(n);
      if (!Number.isFinite(x)) return 1;
      return Math.min(SPEECH_RATE_MAX, Math.max(SPEECH_RATE_MIN, x));
    }

    init();
    initTheme();
    initVoiceController();
    initTwoColumnPrint();
    initTagToggles();
    initMobilePanels();


    function init() {
      // Read path from URL on page load
      const urlParams = new URLSearchParams(window.location.search);
      const pathFromUrl = urlParams.get('path') || '';
      currentRootDirectory = pathFromUrl;

      updateExplorerModeUI();
      getDirectories(currentRootDirectory);

      // Set up event delegation for click handling
      const directoriesList = document.getElementById('directories-list');
      directoriesList.addEventListener('click', (e) => {
        const treeToggle = e.target.closest('[data-tree-toggle]');
        if (treeToggle) {
          e.preventDefault();
          e.stopPropagation();
          toggleTreePath(treeToggle.getAttribute('data-tree-toggle'));
          return;
        }
        const treeItem = e.target.closest('[data-tree-path]');
        if (treeItem) {
          const path = treeItem.getAttribute('data-tree-path');
          const type = treeItem.getAttribute('data-tree-type');
          if (type === 'directory') {
            toggleTreePath(path);
          } else {
            handleTreeFileClick(path);
          }
          return;
        }
        const listItem = e.target.closest('[data-directory]');
        if (listItem && listItem.dataset.directory) {
          handleDirectoryClick(listItem.dataset.directory);
        }
      });

      document.getElementById('btn-explorer-list')?.addEventListener('click', () => {
        setExplorerViewMode('list');
      });
      document.getElementById('btn-explorer-tree')?.addEventListener('click', () => {
        setExplorerViewMode('tree');
      });
      document.getElementById('btn-expand-all')?.addEventListener('click', () => {
        expandAllTree();
      });
      document.getElementById('btn-collapse-all')?.addEventListener('click', () => {
        collapseAllTree();
      });

      const fileContentElement = document.getElementById('file-content');
      if (fileContentElement) {
        fileContentElement.addEventListener('click', handleFileContentLinkClick);
      }

      // Handle browser back/forward buttons
      window.addEventListener('popstate', (e) => {
        const urlParams = new URLSearchParams(window.location.search);
        const pathFromUrl = urlParams.get('path') || '';
        currentRootDirectory = pathFromUrl;
        getDirectories(currentRootDirectory);
      });
    }

    function navigateToViewerPath(path, hash) {
      currentRootDirectory = path;
      updateUrl(path, hash);
      return getDirectories(path);
    }

    function handleFileContentLinkClick(e) {
      const anchor = e.target.closest && e.target.closest('a');
      if (!anchor || !e.currentTarget.contains(anchor)) return;

      const href = anchor.getAttribute('href');
      if (!href || href === '#' || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) {
        return;
      }

      // Same-document anchor
      if (href.charAt(0) === '#') {
        e.preventDefault();
        const id = decodeURIComponent(href.slice(1));
        document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
        history.replaceState(null, '', window.location.pathname + window.location.search + '#' + id);
        return;
      }

      let url;
      try {
        url = new URL(href, window.location.href);
      } catch (_) {
        return;
      }

      // In-app viewer links: /?path=...
      if (url.origin === window.location.origin && url.searchParams.has('path')) {
        e.preventDefault();
        const path = url.searchParams.get('path') || '';
        const hash = url.hash ? url.hash.slice(1) : '';
        navigateToViewerPath(path, hash);
      }
    }

    function initMobilePanels() {
      const mobileMq = window.matchMedia('(max-width: 1023px)');
      const backdrop = document.getElementById('panel-backdrop');
      const btnToc = document.getElementById('btn-mobile-toc');
      const btnMenu = document.getElementById('btn-mobile-menu');
      const tocSidebar = document.getElementById('toc-sidebar');
      const controlsSidebar = document.getElementById('controls-sidebar');
      let openPanel = null;

      function isMobile() {
        return mobileMq.matches;
      }

      function setExpanded(btn, expanded) {
        if (btn) btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      }

      closeMobilePanels = function () {
        openPanel = null;
        tocSidebar?.classList.remove('panel-open');
        controlsSidebar?.classList.remove('panel-open');
        setExpanded(btnToc, false);
        setExpanded(btnMenu, false);
        backdrop?.classList.add('hidden');
        backdrop?.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('drawer-open');
      };

      function openPanelType(type) {
        if (!isMobile()) return;
        const panel = type === 'toc' ? tocSidebar : controlsSidebar;
        const btn = type === 'toc' ? btnToc : btnMenu;
        if (!panel || panel.classList.contains('hidden')) return;

        if (openPanel === type) {
          closeMobilePanels();
          return;
        }

        closeMobilePanels();
        openPanel = type;
        panel.classList.add('panel-open');
        setExpanded(btnToc, type === 'toc');
        setExpanded(btnMenu, type === 'controls');
        backdrop?.classList.remove('hidden');
        backdrop?.setAttribute('aria-hidden', 'false');
        document.body.classList.add('drawer-open');
      }

      btnToc?.addEventListener('click', () => openPanelType('toc'));
      btnMenu?.addEventListener('click', () => openPanelType('controls'));
      backdrop?.addEventListener('click', closeMobilePanels);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMobilePanels();
      });
      mobileMq.addEventListener('change', (e) => {
        if (!e.matches) closeMobilePanels();
      });
    }

    function initTheme() {
      // On page load, resolve theme from localStorage or system preference
      const saved = localStorage.getItem(THEME_KEY);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialMode = saved === THEME_DARK || saved === THEME_LIGHT
        ? saved
        : (prefersDark ? THEME_DARK : THEME_LIGHT);
      applyTheme(initialMode);

      document.getElementById('btn-dark').addEventListener('click', () => applyTheme(THEME_DARK));
      document.getElementById('btn-light').addEventListener('click', () => applyTheme(THEME_LIGHT));
    }

    function initTwoColumnPrint() {
      if (!twoColumnPrintCheckbox) return;
      const saved = localStorage.getItem(TWO_COLUMN_PRINT_KEY);
      const enabled = saved === 'true';
      twoColumnPrintCheckbox.checked = enabled;
      updateTwoColumnPrintClass(enabled);

      twoColumnPrintCheckbox.addEventListener('change', () => {
        const isChecked = twoColumnPrintCheckbox.checked;
        localStorage.setItem(TWO_COLUMN_PRINT_KEY, String(isChecked));
        updateTwoColumnPrintClass(isChecked);
      });
    }

    function updateTwoColumnPrintClass(enabled) {
      document.body.classList.toggle('two-column-print', enabled);
    }

    function getSavedTagToggles() {
      try {
        const raw = localStorage.getItem(TAG_TOGGLE_STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        console.error('Failed to parse tag toggle settings', e);
        return {};
      }
    }

    function saveTagToggles(map) {
      try {
        localStorage.setItem(TAG_TOGGLE_STORAGE_KEY, JSON.stringify(map || {}));
      } catch (e) {
        console.error('Failed to save tag toggle settings', e);
      }
    }

    function initTagToggles() {
      if (!tagToggleContainer || !Array.isArray(TAGS_TO_TOGGLE) || TAGS_TO_TOGGLE.length === 0) return;

      const saved = getSavedTagToggles();
      tagToggleContainer.innerHTML = '';

      TAGS_TO_TOGGLE.forEach(({ tag, label }) => {
        const id = `toggle-tag-${tag}`;
        const isEnabled = saved[tag] !== false;

        const wrapper = document.createElement('label');
        wrapper.setAttribute('for', id);
        wrapper.className = 'w-full flex items-center gap-1.5 cursor-pointer select-none text-gray-700 dark:text-gray-300';
        wrapper.innerHTML = `
          <input type="checkbox" id="${id}" data-tag-toggle="${tag}"
            class="rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 dark:bg-gray-800">
          <span>${label}</span>
        `;

        const input = wrapper.querySelector('input');
        if (input) {
          input.checked = isEnabled;
          input.addEventListener('change', () => {
            const current = getSavedTagToggles();
            current[tag] = input.checked;
            saveTagToggles(current);
            applyTagVisibility(current);
          });
        }

        tagToggleContainer.appendChild(wrapper);
      });

      applyTagVisibility(saved);
    }

    function applyTagVisibility(settings) {
      const fileContentElement = document.getElementById('file-content');
      if (!fileContentElement || !Array.isArray(TAGS_TO_TOGGLE)) return;

      const state = settings || getSavedTagToggles();

      TAGS_TO_TOGGLE.forEach(({ tag }) => {
        const enabled = state[tag] !== false;
        fileContentElement.querySelectorAll(tag).forEach((el) => {
          el.classList.toggle('hidden', !enabled);
        });
      });
    }
    function applyTheme(mode) {
      // Toggle the 'dark' class on the <html> element
      if (mode === THEME_DARK) {
        htmlElement.classList.add(THEME_DARK);
        htmlElement.classList.remove(THEME_LIGHT);
        localStorage.setItem(THEME_KEY, THEME_DARK);
      } else {
        htmlElement.classList.remove(THEME_DARK);
        htmlElement.classList.add(THEME_LIGHT);
        localStorage.setItem(THEME_KEY, THEME_LIGHT);
      }

      // Toggle stylesheets (highlight.js + markdown) to match theme
      const isDark = mode === THEME_DARK;
      document.getElementById('hljs-dark').media = isDark ? 'all' : 'none';
      document.getElementById('hljs-light').media = isDark ? 'none' : 'all';
      document.getElementById('markdown-dark').media = isDark ? 'all' : 'none';
      document.getElementById('markdown-light').media = isDark ? 'none' : 'all';
    }


    function initVoiceController() {

      function populateVoices() {
        const voices = speechSynthesis.getVoices();
        const englishVoices = voices.filter(v => v.lang.startsWith('en'));
        voiceSelect.innerHTML = '<option value="">Select voice…</option>' +
          englishVoices.map(v => `<option value="${escapeHtmlAttr(v.name)}">${escapeHtmlAttr(v.name)} (${escapeHtmlAttr(v.lang)})</option>`).join('');

        const saved = localStorage.getItem(VOICE_STORAGE_KEY);
        if (saved && [...voiceSelect.options].some(o => o.value === saved)) {
          voiceSelect.value = saved;
        }
      }

      function escapeHtmlAttr(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      if (speechSynthesis.getVoices().length) {
        populateVoices();
      } else {
        speechSynthesis.addEventListener('voiceschanged', populateVoices);
      }

      voiceSelect.addEventListener('change', () => {
        const value = voiceSelect.value;
        if (value) localStorage.setItem(VOICE_STORAGE_KEY, value);
      });

      const savedSkipCode = localStorage.getItem(SKIP_CODE_BLOCKS_KEY);
      if (skipCodeBlocksCheckbox) {
        skipCodeBlocksCheckbox.checked = savedSkipCode === 'true';
        skipCodeBlocksCheckbox.addEventListener('change', () => {
          localStorage.setItem(SKIP_CODE_BLOCKS_KEY, String(skipCodeBlocksCheckbox.checked));
        });
      }

      function formatSpeechRateDisplay(v) {
        const x = clampSpeechRate(v);
        return (Math.round(x * 10) / 10).toFixed(1) + '×';
      }

      function syncSpeechRateUi() {
        if (!speechRateInput) return;
        const saved = localStorage.getItem(SPEECH_RATE_KEY);
        if (saved != null && saved !== '') {
          const r = clampSpeechRate(parseFloat(saved));
          speechRateInput.value = String(r);
        }
        if (speechRateValueEl) speechRateValueEl.textContent = formatSpeechRateDisplay(speechRateInput.value);
      }

      syncSpeechRateUi();
      if (speechRateInput) {
        speechRateInput.addEventListener('input', () => {
          const r = clampSpeechRate(parseFloat(speechRateInput.value));
          speechRateInput.value = String(r);
          localStorage.setItem(SPEECH_RATE_KEY, speechRateInput.value);
          if (speechRateValueEl) speechRateValueEl.textContent = formatSpeechRateDisplay(r);
        });
      }

      btnPlay.addEventListener('click', () => {
        const text = getSpeakableContent();
        if (!text) return;
        speakText(text);
      });

      btnPause.addEventListener('click', () => {
        if (speechSynthesis.speaking) speechSynthesis.pause();
      });

      btnResume.addEventListener('click', () => {
        // if (speechSynthesis.paused) speechSynthesis.resume();
        speechSynthesis.resume();
      });

      btnStop.addEventListener('click', () => {
        speechSynthesis.cancel();
      });
    }

    function getSpeakableContentFromRoot(rootEl) {
      if (!rootEl) return '';
      const clone = rootEl.cloneNode(true);
      clone.querySelectorAll('.md-heading-actions').forEach((w) => w.remove());
      if (skipCodeBlocksCheckbox && skipCodeBlocksCheckbox.checked) {
        clone.querySelectorAll('pre').forEach((pre) => {
          pre.innerText = codeblockAlternativeText;
        });
      }
      return clone.innerText || '';
    }

    function getSpeakableContent() {
      const el = document.getElementById('file-content');
      return getSpeakableContentFromRoot(el).trim();
    }

    function getHeadingLevel(tagName) {
      const m = /^H([1-6])$/i.exec(tagName || '');
      return m ? parseInt(m[1], 10) : 0;
    }

    /** Siblings after `heading` until the next heading of same or higher outline level. */
    function getSectionElementsAfterHeading(heading) {
      const level = getHeadingLevel(heading.tagName);
      const nodes = [];
      let n = heading.nextElementSibling;
      while (n) {
        const nextLevel = getHeadingLevel(n.tagName);
        if (nextLevel > 0 && nextLevel <= level) break;
        nodes.push(n);
        n = n.nextElementSibling;
      }
      return nodes;
    }

    function getSpeakableTextForHeadingSection(heading) {
      const wrap = document.createElement('div');
      wrap.appendChild(heading.cloneNode(true));
      getSectionElementsAfterHeading(heading).forEach((el) => {
        wrap.appendChild(el.cloneNode(true));
      });
      return getSpeakableContentFromRoot(wrap).trim();
    }

    /** Heading plus all following siblings inside the document (to end of article). */
    function getSpeakableTextFromHeadingToEnd(heading) {
      const wrap = document.createElement('div');
      wrap.appendChild(heading.cloneNode(true));
      let n = heading.nextElementSibling;
      while (n) {
        wrap.appendChild(n.cloneNode(true));
        n = n.nextElementSibling;
      }
      return getSpeakableContentFromRoot(wrap).trim();
    }

    const SECTION_PLAY_SVG =
      '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>';

    const SECTION_PLAY_TO_END_SVG =
      '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/><path d="M19 5h2v14h-2V5z"/></svg>';

    const HEADING_AUDIO_BTN_CLASS =
      'heading-audio-btn no-print p-2 rounded text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors';

    function speakText(text) {
      const t = String(text || '').trim();
      if (!t) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t);
      const voices = speechSynthesis.getVoices();
      const chosen = voiceSelect && voiceSelect.value && voices.find((v) => v.name === voiceSelect.value);
      if (chosen) u.voice = chosen;
      u.lang = 'en';
      if (speechRateInput) {
        u.rate = clampSpeechRate(parseFloat(speechRateInput.value));
      }
      speechSynthesis.speak(u);
    }

    function enhanceHeadingsWithSectionPlay(container) {
      if (!container) return;
      container.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach((heading) => {
        if (heading.querySelector('.md-heading-actions')) return;
        heading.classList.add('md-heading-with-play');

        const textWrap = document.createElement('span');
        textWrap.className = 'md-heading-text';
        while (heading.firstChild) {
          textWrap.appendChild(heading.firstChild);
        }

        const actions = document.createElement('span');
        actions.className = 'md-heading-actions';
        actions.setAttribute('role', 'group');
        actions.setAttribute('aria-label', 'Speech playback for this heading');

        const btnSection = document.createElement('button');
        btnSection.type = 'button';
        btnSection.className = HEADING_AUDIO_BTN_CLASS;
        btnSection.setAttribute('aria-label', 'Play section from this heading');
        btnSection.title = 'Play this section';
        btnSection.innerHTML = SECTION_PLAY_SVG;
        btnSection.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          speakText(getSpeakableTextForHeadingSection(heading));
        });

        const btnToEnd = document.createElement('button');
        btnToEnd.type = 'button';
        btnToEnd.className = HEADING_AUDIO_BTN_CLASS;
        btnToEnd.setAttribute('aria-label', 'Play from this heading to end of document');
        btnToEnd.title = 'Play from here to end';
        btnToEnd.innerHTML = SECTION_PLAY_TO_END_SVG;
        btnToEnd.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          speakText(getSpeakableTextFromHeadingToEnd(heading));
        });

        actions.appendChild(btnSection);
        actions.appendChild(btnToEnd);
        heading.appendChild(textWrap);
        heading.appendChild(actions);
      });
    }

    function encodeViewerPath(path) {
      // Encode only &, =, % so slashes stay as /
      return String(path || '').replace(/%/g, '%25').replace(/&/g, '%26').replace(/=/g, '%3D');
    }

    function updateUrl(path, hash) {
      let newUrl = window.location.origin + window.location.pathname;
      if (path) {
        newUrl += '?path=' + encodeViewerPath(path);
      }
      if (hash) {
        newUrl += '#' + String(hash).replace(/^#/, '');
      }
      window.history.pushState({ path, hash: hash || '' }, '', newUrl);
    }

    function showExplorerError(message) {
      const el = document.getElementById('explorer-error');
      if (!message) {
        el.textContent = '';
        el.classList.add('hidden');
        return;
      }
      el.textContent = message;
      el.classList.remove('hidden');
    }

    function formatApiError(data, status) {
      if (data?.error && data?.path) {
        return `${data.error}: ${data.path}`;
      }
      if (data?.error) {
        return data.error;
      }
      if (data?.message) {
        return data.message;
      }
      return `Request failed (${status})`;
    }

    function updateExplorerModeUI() {
      const listBtn = document.getElementById('btn-explorer-list');
      const treeBtn = document.getElementById('btn-explorer-tree');
      const expandBtn = document.getElementById('btn-expand-all');
      const collapseBtn = document.getElementById('btn-collapse-all');
      const isTree = explorerViewMode === 'tree';
      if (listBtn) {
        listBtn.classList.toggle('explorer-mode-active', explorerViewMode === 'list');
        listBtn.setAttribute('aria-pressed', explorerViewMode === 'list' ? 'true' : 'false');
      }
      if (treeBtn) {
        treeBtn.classList.toggle('explorer-mode-active', isTree);
        treeBtn.setAttribute('aria-pressed', isTree ? 'true' : 'false');
      }
      if (expandBtn) {
        expandBtn.classList.toggle('hidden', !isTree);
      }
      if (collapseBtn) {
        collapseBtn.classList.toggle('hidden', !isTree);
      }
    }

    function setExplorerViewMode(mode) {
      if (mode !== 'list' && mode !== 'tree') return;
      if (explorerViewMode === mode) return;
      explorerViewMode = mode;
      localStorage.setItem(EXPLORER_VIEW_KEY, mode);
      updateExplorerModeUI();
      getDirectories(currentRootDirectory);
    }

    function escapeHtmlAttr(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function escapeHtmlText(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function joinTreePath(prefix, name) {
      return prefix ? `${prefix}/${name}` : name;
    }

    function collectDirectoryPaths(nodes, prefix, into) {
      if (!Array.isArray(nodes)) return;
      for (const node of nodes) {
        const nodePath = joinTreePath(prefix, node.name);
        if (node.type === 'directory') {
          into.add(nodePath);
          collectDirectoryPaths(node.children, nodePath, into);
        }
      }
    }

    function expandAncestorsOf(filePath) {
      const parts = String(filePath || '').split('/').filter(Boolean);
      let acc = '';
      for (let i = 0; i < parts.length - 1; i++) {
        acc = acc ? `${acc}/${parts[i]}` : parts[i];
        expandedPaths.add(acc);
      }
    }

    function expandAllTree() {
      const all = new Set();
      collectDirectoryPaths(treeData, treeBase, all);
      expandedPaths = all;
      renderTree(treeData, activeTreePath);
    }

    function collapseAllTree() {
      expandedPaths = new Set();
      renderTree(treeData, activeTreePath);
    }

    function toggleTreePath(path) {
      if (!path) return;
      if (expandedPaths.has(path)) {
        expandedPaths.delete(path);
      } else {
        expandedPaths.add(path);
      }
      renderTree(treeData, activeTreePath);
    }

    function handleTreeFileClick(path) {
      getDirectories(path, { preserveTree: true }).then(ok => {
        if (ok) {
          currentRootDirectory = path;
          updateUrl(currentRootDirectory);
        }
      });
    }

    function getDirectories(root = '', options = {}) {
      const preserveTree = Boolean(options.preserveTree)
        && explorerViewMode === 'tree'
        && treeData.length > 0;
      const wantTree = explorerViewMode === 'tree' && !preserveTree;
      let url = `${API_BASE_URL}/directories`;
      const params = [];
      if (root) params.push(`root=${encodeURIComponent(root)}`);
      if (wantTree) params.push('tree=1');
      if (params.length) url += '?' + params.join('&');

      return fetch(url, { cache: 'no-store' })
        .then(async response => {
          const data = await response.json();
          if (!response.ok) {
            showExplorerError(formatApiError(data, response.status));
            return false;
          }
          showExplorerError('');
          viewingFile = Boolean(data.fileContent);

          if (explorerViewMode === 'tree') {
            const keepTree = preserveTree && viewingFile;
            if (!keepTree) {
              treeData = Array.isArray(data.tree) ? data.tree : [];
              treeBase = typeof data.treeBase === 'string' ? data.treeBase : '';
            }
            activeTreePath = viewingFile ? root : null;
            if (activeTreePath) {
              expandAncestorsOf(activeTreePath);
            }
            renderTree(treeData, activeTreePath);
          } else {
            const list = Array.isArray(data.list) ? data.list : [];
            const directories = ['..', ...list];
            const activeName = viewingFile
              ? root.split('/').filter(Boolean).pop() || null
              : null;
            renderDirectories(directories, activeName);
          }

          if (data.fileContent) {
            renderFileContent(data.fileContent, root);
          } else {
            showEmptyFileContent();
          }
          return true;
        })
        .catch(error => {
          showExplorerError('Failed to fetch directories');
          console.error('Error fetching directories:', error);
          return false;
        });
    }

    function renderDirectories(directories, activeName = null) {
      const directoriesList = document.getElementById('directories-list');
      const items = directories.map(directory => {
        const isParent = directory === '..';
        const displayName = isParent ? '.. (go back)' : directory;
        const isActive = activeName && directory === activeName;
        const activeClass = isActive
          ? ' font-semibold text-blue-600 dark:text-blue-400'
          : '';
        const escapedDirectory = escapeHtmlAttr(directory);
        return `<li class="cursor-pointer hover:text-blue-600 dark:hover:text-blue-400 hover:underline py-1 text-inherit${activeClass}" data-directory="${escapedDirectory}">${escapeHtmlText(displayName)}</li>`;
      }).join('');
      directoriesList.innerHTML = `<ol class="explorer-list">${items}</ol>`;
    }

    function renderTreeNodes(nodes, prefix, activePath) {
      if (!Array.isArray(nodes) || nodes.length === 0) return '';
      return nodes.map(node => {
        const nodePath = joinTreePath(prefix, node.name);
        const isDir = node.type === 'directory';
        const isExpanded = isDir && expandedPaths.has(nodePath);
        const isActive = activePath && nodePath === activePath;
        const activeClass = isActive ? ' is-active' : '';
        const chevron = isDir
          ? `<span class="explorer-tree-chevron" data-tree-toggle="${escapeHtmlAttr(nodePath)}" aria-hidden="true">${isExpanded ? '▼' : '▶'}</span>`
          : '<span class="explorer-tree-spacer" aria-hidden="true"></span>';
        const childrenHtml = isDir && isExpanded
          ? `<ul class="explorer-tree">${renderTreeNodes(node.children || [], nodePath, activePath)}</ul>`
          : '';
        return `<li>
          <div class="explorer-tree-item${activeClass}" data-tree-path="${escapeHtmlAttr(nodePath)}" data-tree-type="${isDir ? 'directory' : 'file'}" title="${escapeHtmlAttr(node.name)}">
            ${chevron}
            <span class="explorer-tree-label">${escapeHtmlText(node.name)}</span>
          </div>
          ${childrenHtml}
        </li>`;
      }).join('');
    }

    function renderTree(nodes, activePath = null) {
      const directoriesList = document.getElementById('directories-list');
      const parentRow = `<li>
        <div class="explorer-tree-item" data-directory=".." title="Go back">
          <span class="explorer-tree-spacer" aria-hidden="true"></span>
          <span class="explorer-tree-label">.. (go back)</span>
        </div>
      </li>`;
      directoriesList.innerHTML = `<ul class="explorer-tree">${parentRow}${renderTreeNodes(nodes, treeBase, activePath)}</ul>`;
    }

    function handleDirectoryClick(directory) {
      let nextRoot;
      if (directory === '..') {
        // Go back to parent directory
        if (currentRootDirectory === '') {
          // At root, navigate to parent directory
          nextRoot = '..';
        } else {
          // Remove the last path segment or add another '..'
          const pathParts = currentRootDirectory.split('/').filter(p => p);

          if (pathParts.length > 0 && pathParts[pathParts.length - 1] !== '..') {
            // Remove the last path segment if it's not '..'
            pathParts.pop();
            nextRoot = pathParts.length > 0 ? pathParts.join('/') : '';
          } else {
            // Add another '..' to go further up
            nextRoot = currentRootDirectory ? `${currentRootDirectory}/..` : '..';
          }
        }
      } else if (viewingFile) {
        // Sibling of the open file: navigate relative to parent folder
        const pathParts = currentRootDirectory.split('/').filter(p => p);
        pathParts.pop();
        const parent = pathParts.length > 0 ? pathParts.join('/') : '';
        nextRoot = parent ? `${parent}/${directory}` : directory;
      } else {
        // Navigate into the selected directory
        nextRoot = currentRootDirectory
          ? `${currentRootDirectory}/${directory}`
          : directory;
      }
      getDirectories(nextRoot).then(ok => {
        if (ok) {
          currentRootDirectory = nextRoot;
          // Update URL with new path
          updateUrl(currentRootDirectory);
        }
      });
    }
    function renderDirectory(directory) {
      const directoryItem = document.createElement('div');
      directoryItem.classList.add('directory-item');
      directoryItem.innerHTML = `<a href="/${directory}">${directory}</a>`;
      return directoryItem;
    }

    function assignHeadingIds(contentEl) {
      if (!contentEl) return;
      const used = Object.create(null);
      contentEl.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach((h) => {
        const base = (h.id && slugify(h.id)) || slugify(h.textContent);
        let n = used[base] || 0;
        const id = n === 0 ? base : base + '-' + n;
        used[base] = n + 1;
        h.id = id;
      });
    }

    function buildTableOfContents(contentEl) {
      const tocSidebar = document.getElementById('toc-sidebar');
      if (!tocSidebar) return;
      const headings = contentEl ? contentEl.querySelectorAll('h1, h2, h3, h4, h5, h6') : [];
      if (headings.length === 0) {
        tocSidebar.innerHTML = '';
        tocSidebar.classList.add('hidden');
        return;
      }
      assignHeadingIds(contentEl);
      const nav = document.createElement('nav');
      nav.setAttribute('aria-label', 'Table of contents');
      headings.forEach((h) => {
        const id = h.id;
        const a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = h.textContent;
        a.classList.add('toc-' + h.tagName.toLowerCase());
        a.addEventListener('click', (e) => {
          e.preventDefault();
          document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
          history.replaceState(null, '', window.location.pathname + window.location.search + '#' + id);
          closeMobilePanels();
        });
        nav.appendChild(a);
      });
      const title = document.createElement('div');
      title.className = 'font-medium mb-2 text-gray-700 dark:text-gray-400';
      title.textContent = 'Table of Contents';
      tocSidebar.innerHTML = '';
      tocSidebar.appendChild(title);
      tocSidebar.appendChild(nav);
      tocSidebar.classList.remove('hidden');
    }

    function slugify(text) {
      // GitHub-compatible-ish heading slug for in-document #anchors
      return String(text || '')
        .trim()
        .toLowerCase()
        .replace(/['’]/g, '')
        .replace(/[^\w\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '') || 'section';
    }

    function showEmptyFileContent() {
      const fileContentElement = document.getElementById('file-content');
      if (!fileContentElement) return;
      fileContentElement.innerHTML =
        '<p class="file-content-empty text-center text-gray-500 dark:text-gray-400 py-8 lg:py-12">Select a file from the File Explorer to view its contents.</p>';
      voiceControllerContent = '';
      buildTableOfContents(null);
    }

    function resolveRelativePath(filePath, relativeUrl) {
      if (!relativeUrl || /^(https?:|data:|\/\/)/i.test(relativeUrl)) {
        return relativeUrl;
      }
      const baseParts = filePath.includes('/')
        ? filePath.slice(0, filePath.lastIndexOf('/')).split('/').filter((s) => s !== '')
        : [];
      const resolved = [...baseParts];
      for (const seg of relativeUrl.split('/')) {
        if (!seg || seg === '.') continue;
        if (seg === '..') {
          if (resolved.length && resolved[resolved.length - 1] !== '..') {
            resolved.pop();
          } else {
            resolved.push('..');
          }
        } else {
          resolved.push(seg);
        }
      }
      return resolved.join('/');
    }

    function toAssetUrl(href, filePath) {
      if (!href || /^(https?:|data:|\/\/)/i.test(href)) {
        return href;
      }
      const resolved = resolveRelativePath(filePath, href);
      return `${API_BASE_URL}/asset?root=${encodeURIComponent(resolved)}`;
    }

    function toViewerHref(resolvedPath, hash) {
      let href = window.location.pathname + '?path=' + encodeViewerPath(resolvedPath);
      if (hash) {
        href += '#' + String(hash).replace(/^#/, '');
      }
      return href;
    }

    function toInternalLinkHref(href, filePath) {
      if (!href || /^(https?:|mailto:|tel:|data:|\/\/)/i.test(href)) {
        return href;
      }
      if (href.charAt(0) === '#') {
        return href;
      }

      let pathPart = href;
      let hash = '';
      const hashIdx = href.indexOf('#');
      if (hashIdx >= 0) {
        pathPart = href.slice(0, hashIdx);
        hash = href.slice(hashIdx + 1);
      }
      if (!pathPart) {
        return hash ? '#' + hash : href;
      }

      const resolved = pathPart.charAt(0) === '/'
        ? pathPart.replace(/^\/+/, '')
        : resolveRelativePath(filePath, pathPart);
      return toViewerHref(resolved, hash);
    }

    function renderFileContent(fileContent, filePath) {
      const fileContentElement = document.getElementById('file-content');
      if (!fileContent) {
        showEmptyFileContent();
        return;
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Extension -> highlight.js language for raw source files (no Markdown)
      const codeExtensions = {
        '.java': 'java',
        '.js': 'javascript',
        '.ts': 'typescript',
        '.py': 'python',
        '.go': 'go',
        '.rs': 'rust',
        '.c': 'c',
        '.cpp': 'cpp',
        '.cs': 'csharp',
        '.rb': 'ruby',
        '.php': 'php',
        '.swift': 'swift',
        '.kt': 'kotlin',
        '.scala': 'scala',
        '.sql': 'sql',
        '.sh': 'bash',
        '.bash': 'bash',
        '.yaml': 'yaml',
        '.yml': 'yaml',
        '.json': 'json',
        '.xml': 'xml',
        '.html': 'html',
        '.css': 'css'
      };

      const ext = filePath.includes('.') ? '.' + filePath.split('.').pop().toLowerCase() : '';
      const language = codeExtensions[ext];

      if (language) {
        // Raw source file: render as a single code block (no Markdown)
        const escaped = escapeHtml(fileContent);
        fileContentElement.innerHTML = `<pre><code class="language-${language}">${escaped}</code></pre>`;
      } else {
        // Markdown or unknown: parse as Markdown
        const renderer = new marked.Renderer();
        renderer.code = function (code, lang) {
          const langClass = lang ? ` class="language-${lang}"` : '';
          return `<pre><code${langClass}>${escapeHtml(code)}</code></pre>`;
        };
        renderer.image = function (hrefOrToken, title, text) {
          let href;
          let imgTitle;
          let alt;
          if (hrefOrToken && typeof hrefOrToken === 'object') {
            href = hrefOrToken.href;
            imgTitle = hrefOrToken.title;
            alt = hrefOrToken.text;
          } else {
            href = hrefOrToken;
            imgTitle = title;
            alt = text;
          }
          const src = toAssetUrl(href, filePath);
          const titleAttr = imgTitle ? ` title="${escapeHtml(imgTitle)}"` : '';
          return `<img src="${escapeHtml(src)}" alt="${escapeHtml(alt || '')}"${titleAttr}>`;
        };
        renderer.link = function (hrefOrToken, title, text) {
          let href;
          let linkTitle;
          let linkText;
          if (hrefOrToken && typeof hrefOrToken === 'object') {
            href = hrefOrToken.href;
            linkTitle = hrefOrToken.title;
            linkText = hrefOrToken.tokens && this.parser
              ? this.parser.parseInline(hrefOrToken.tokens)
              : hrefOrToken.text;
          } else {
            href = hrefOrToken;
            linkTitle = title;
            linkText = text;
          }
          const resolvedHref = toInternalLinkHref(href, filePath);
          const titleAttr = linkTitle ? ` title="${escapeHtml(linkTitle)}"` : '';
          const isExternal = /^(https?:|mailto:|tel:|\/\/)/i.test(href || '');
          const externalAttrs = isExternal ? ' target="_blank" rel="noopener noreferrer"' : '';
          return `<a href="${escapeHtml(resolvedHref || '')}"${titleAttr}${externalAttrs}>${linkText}</a>`;
        };
        marked.setOptions({
          breaks: true,
          gfm: true,
          renderer: renderer
        });
        fileContentElement.innerHTML = marked.parse(fileContent);
      }

      applyTagVisibility();

      voiceControllerContent = fileContentElement.innerText || '';

      buildTableOfContents(fileContentElement);
      enhanceHeadingsWithSectionPlay(fileContentElement);

      // Scroll to hash if present in URL (e.g. after refresh or direct link)
      if (window.location.hash) {
        const id = window.location.hash.slice(1);
        setTimeout(() => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' }), 100);
      }

      // Highlight all code blocks using highlight.js
      // Use setTimeout to ensure DOM is ready
      setTimeout(() => {
        if (typeof hljs !== 'undefined' && hljs.highlightElement) {
          fileContentElement.querySelectorAll('pre code').forEach((block) => {
            try {
              // Remove any existing highlight classes to avoid conflicts
              block.classList.remove('hljs');
              // Highlight the code block
              hljs.highlightElement(block);
            } catch (err) {
              console.error('Error highlighting code block:', err);
            }
          });
        } else {
          console.error('Highlight.js is not loaded');
        }
      }, 0);
    }
  </script>
