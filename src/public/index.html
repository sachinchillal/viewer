<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewer</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <!-- Highlight.js for syntax highlighting (dark + light) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    id="hljs-dark" media="all">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    id="hljs-light" media="none">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- GitHub Markdown CSS (dark + light) -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css"
    id="markdown-dark" media="all">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css"
    id="markdown-light" media="none">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script>
    tailwind.config = {
      // Enable class-based dark mode
      darkMode: 'class'
    }
  </script>
  <style>
    /* Ensure html/body background follows theme (Tailwind class applies on html) */
    html {
      background-color: #fff;
      color: #000;
    }

    html.dark {
      background-color: #111827;
      color: #e5e7eb;
    }

    body {
      background-color: inherit;
      color: inherit;
      /* overflow-x: hidden; */
    }

    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0;
      /* margin: 0 auto; */
      padding: 45px;
      background-color: #fff;
    }

    html.dark .markdown-body {
      background-color: #0d1117;
    }

    .markdown-body ol,
    .markdown-body ul {
      list-style: auto;
    }

    @media (max-width: 767px) {
      .markdown-body {
        padding: 15px;
      }
    }

    .toc-sidebar,
    .right-sidebar {
      position: sticky;
      top: 1rem;
      max-height: calc(100vh - 2rem);
      overflow-y: auto;
      font-size: 12px;
    }

    .right-sidebar {
      height: calc(100vh - 2rem);
    }

    .toc-sidebar a {
      display: block;
      padding: 0.25rem 0;
      color: inherit;
      text-decoration: none;
      border-left: 2px solid transparent;
      padding-left: 0.5rem;
      margin-left: 0;
      font-size: 12px;
    }

    .toc-sidebar a:hover {
      color: #2563eb;
    }

    html.dark .toc-sidebar a:hover {
      color: #60a5fa;
    }

    .toc-sidebar .toc-h2 {
      margin-left: 0;
    }

    .toc-sidebar .toc-h3 {
      margin-left: 0.75rem;
    }

    .toc-sidebar .toc-h4 {
      margin-left: 1.5rem;
    }

    .toc-sidebar .toc-h5 {
      margin-left: 2.25rem;
    }

    .toc-sidebar .toc-h6 {
      margin-left: 3rem;
    }

    html {
      scroll-behavior: smooth;
    }

    /* Per-heading play control: appears on heading hover / focus-within */
    .markdown-body h1.md-heading-with-play,
    .markdown-body h2.md-heading-with-play,
    .markdown-body h3.md-heading-with-play,
    .markdown-body h4.md-heading-with-play,
    .markdown-body h5.md-heading-with-play,
    .markdown-body h6.md-heading-with-play {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.35rem 0.5rem;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .markdown-body .md-heading-text {
      min-width: 0;
      flex: 1 1 auto;
    }

    .markdown-body .md-heading-actions {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      gap: 0.25rem;
      margin-top: 0.15em;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .markdown-body h1.md-heading-with-play:hover .md-heading-actions,
    .markdown-body h2.md-heading-with-play:hover .md-heading-actions,
    .markdown-body h3.md-heading-with-play:hover .md-heading-actions,
    .markdown-body h4.md-heading-with-play:hover .md-heading-actions,
    .markdown-body h5.md-heading-with-play:hover .md-heading-actions,
    .markdown-body h6.md-heading-with-play:hover .md-heading-actions,
    .markdown-body h1.md-heading-with-play:focus-within .md-heading-actions,
    .markdown-body h2.md-heading-with-play:focus-within .md-heading-actions,
    .markdown-body h3.md-heading-with-play:focus-within .md-heading-actions,
    .markdown-body h4.md-heading-with-play:focus-within .md-heading-actions,
    .markdown-body h5.md-heading-with-play:focus-within .md-heading-actions,
    .markdown-body h6.md-heading-with-play:focus-within .md-heading-actions {
      opacity: 1;
    }

    /* Touch / no-hover: keep control discoverable (primary interaction is still tap) */
    @media (hover: none) {
      .markdown-body .md-heading-actions {
        opacity: 0.55;
      }
    }

    @media print {
      /* @media screen,
    print { */

      ol,
      ul {
        line-height: 1.2;
      }

      .no-print,
      #toc-sidebar {
        display: none !important;
        /* Hide elements in print */
      }

      html,
      body {
        background: #fff !important;
        color: #000 !important;
        line-height: 1 !important;
      }

      .markdown-body {
        background-color: #fff !important;
        color: #000 !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .markdown-body a {
        color: #0550ae !important;
      }

      .markdown-body pre,
      .markdown-body code,
      .markdown-body .hljs {
        border: 1px solid #e1e4e8;
      }

      pre,
      code {
        color: #000 !important;
        background: transparent !important;
        border: none !important;
      }

      .container a,
      .container h1 {
        color: #000 !important;
      }

      #directories-list li {
        color: #000 !important;
      }

      p,
      hr,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        margin: 0 !important;
      }

      body.two-column-print .markdown-body {
        column-count: 2;
        column-gap: 0;
        /* column-gap: 2rem; */
      }

      body.two-column-print h1 {
        font-size: 1.25rem !important;
      }
    }
  </style>
</head>

<body>
  <div class="w-full max-w-full px-4 py-4 box-border">
    <div class="flex gap-6">
      <aside id="toc-sidebar" class="toc-sidebar w-48 shrink-0 no-print hidden"></aside>
      <main class="flex-1 min-w-0 w-full">
        <div class="no-print flex justify-between items-center">
          <a href="/" class="text-blue-600 dark:text-blue-400">
            <h1 class="text-2xl font-bold">Viewer</h1>
          </a>
        </div>
        <div id="file-content" class="markdown-body mt-6"></div>
      </main>
      <aside class="right-sidebar w-48 shrink-0 no-print flex flex-col">
        <label for="directories-list" class="font-medium text-gray-700 dark:text-gray-400 shrink-0">File
          Explorer</label>
        <ol id="directories-list" class="list-decimal list-inside no-print"></ol>
        <i class="mt-auto"></i>

        <div class="flex flex-col gap-2 mt-2">
          <label for="is-two-column-print"
            class="w-full flex items-center gap-1.5 cursor-pointer select-none text-gray-700 dark:text-gray-300 shrink-0">
            <input type="checkbox" id="is-two-column-print"
              class="rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 dark:bg-gray-800">
            <span>Is Two Column Print</span>
          </label>
          <div>
            <button type="button" id="btn-dark"
              class="px-2 py-1 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">Dark</button>
            <button type="button" id="btn-light"
              class="px-2 py-1 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">Light</button>
          </div>
        </div>
        <div class="mt-4">
          <p class="font-medium text-gray-700 dark:text-gray-400">Toggle tags</p>
          <div id="tag-toggle-controls" class="mt-1 flex flex-col gap-1"></div>
        </div>
        <i class="mt-auto"></i>
        <div id="voice-controller" class="mt-6 no-print flex flex-wrap items-center gap-2 justify-start">
          <label for="voice-select" class="font-medium text-gray-700 dark:text-gray-400 shrink-0">Voice</label>
          <select id="voice-select"
            class="px-2 py-1 text-sm rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:ring-blue-400 dark:focus:border-blue-400 outline-none transition-colors"
            style="width: stretch;">
            <option value="">Select voice…</option>
            <option value="default">Default</option>
          </select>
          <label
            class="w-full flex items-center gap-1.5 cursor-pointer select-none text-gray-700 dark:text-gray-300 shrink-0">
            <input type="checkbox" id="skip-code-blocks"
              class="rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 dark:bg-gray-800">
            <span>Skip code blocks</span>
          </label>
          <div class="w-full flex flex-col gap-1.5 mt-1">
            <div class="flex items-center justify-between gap-2">
              <label for="speech-rate" class="font-medium text-gray-700 dark:text-gray-400 text-xs shrink-0">Speech
                rate</label>
              <span id="speech-rate-value"
                class="text-xs tabular-nums text-gray-600 dark:text-gray-400 shrink-0">1.0×</span>
            </div>
            <input type="range" id="speech-rate" min="0.5" max="2" step="0.1" value="1"
              class="w-full h-2 rounded-lg appearance-none bg-gray-200 dark:bg-gray-600 accent-blue-600 dark:accent-blue-500 cursor-pointer">
            <div class="flex justify-between text-[10px] text-gray-500 dark:text-gray-400 leading-none">
              <span>Slower</span>
              <span>Faster</span>
            </div>
          </div>
          <button type="button" id="btn-play" title="Play"
            class="p-2 rounded text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7L8 5z" />
            </svg>
          </button>
          <button type="button" id="btn-pause" title="Pause"
            class="p-2 rounded text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>
          <button type="button" id="btn-resume" title="Resume"
            class="p-2 rounded text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7L8 5z" />
              <circle cx="18" cy="4" r="2" />
            </svg>
          </button>
          <button type="button" id="btn-stop" title="Stop"
            class="p-2 rounded text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6h12v12H6z" />
            </svg>
          </button>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const THEME_KEY = 'viewer-theme';
    const THEME_DARK = 'dark';
    const THEME_LIGHT = 'light';
    const htmlElement = document.documentElement;
    const TAGS_TO_TOGGLE = [
      {
        tag: 'blockquote',
        label: 'Blockquote'
      }
    ];
    const TAG_TOGGLE_STORAGE_KEY = 'viewer-tag-toggles';
    const tagToggleContainer = document.getElementById('tag-toggle-controls');
    // Voice
    const VOICE_STORAGE_KEY = 'viewer-voice';
    const SKIP_CODE_BLOCKS_KEY = 'viewer-skip-code-blocks';
    const SPEECH_RATE_KEY = 'viewer-speech-rate';
    const SPEECH_RATE_MIN = 0.5;
    const SPEECH_RATE_MAX = 2;
    const TWO_COLUMN_PRINT_KEY = 'viewer-two-column-print';
    const voiceSelect = document.getElementById('voice-select');
    const speechRateInput = document.getElementById('speech-rate');
    const speechRateValueEl = document.getElementById('speech-rate-value');
    const btnPlay = document.getElementById('btn-play');
    const btnPause = document.getElementById('btn-pause');
    const btnResume = document.getElementById('btn-resume');
    const btnStop = document.getElementById('btn-stop');
    const skipCodeBlocksCheckbox = document.getElementById('skip-code-blocks');
    const twoColumnPrintCheckbox = document.getElementById('is-two-column-print');
    const codeblockAlternativeText = "See the code block for more details.";
    let voiceControllerContent = "";

    let directories = [];
    let currentRootDirectory = '';

    function clampSpeechRate(n) {
      const x = Number(n);
      if (!Number.isFinite(x)) return 1;
      return Math.min(SPEECH_RATE_MAX, Math.max(SPEECH_RATE_MIN, x));
    }

    init();
    initTheme();
    initVoiceController();
    initTwoColumnPrint();
    initTagToggles();


    function init() {
      // Read path from URL on page load
      const urlParams = new URLSearchParams(window.location.search);
      const pathFromUrl = urlParams.get('path') || '';
      currentRootDirectory = pathFromUrl;

      getDirectories(currentRootDirectory);

      // Set up event delegation for click handling
      const directoriesList = document.getElementById('directories-list');
      directoriesList.addEventListener('click', (e) => {
        if (e.target.tagName === 'LI' && e.target.dataset.directory) {
          handleDirectoryClick(e.target.dataset.directory);
        }
      });

      // Handle browser back/forward buttons
      window.addEventListener('popstate', (e) => {
        const urlParams = new URLSearchParams(window.location.search);
        const pathFromUrl = urlParams.get('path') || '';
        currentRootDirectory = pathFromUrl;
        getDirectories(currentRootDirectory);
      });
    }

    function initTheme() {
      // On page load, resolve theme from localStorage or system preference
      const saved = localStorage.getItem(THEME_KEY);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialMode = saved === THEME_DARK || saved === THEME_LIGHT
        ? saved
        : (prefersDark ? THEME_DARK : THEME_LIGHT);
      applyTheme(initialMode);

      document.getElementById('btn-dark').addEventListener('click', () => applyTheme(THEME_DARK));
      document.getElementById('btn-light').addEventListener('click', () => applyTheme(THEME_LIGHT));
    }

    function initTwoColumnPrint() {
      if (!twoColumnPrintCheckbox) return;
      const saved = localStorage.getItem(TWO_COLUMN_PRINT_KEY);
      const enabled = saved === 'true';
      twoColumnPrintCheckbox.checked = enabled;
      updateTwoColumnPrintClass(enabled);

      twoColumnPrintCheckbox.addEventListener('change', () => {
        const isChecked = twoColumnPrintCheckbox.checked;
        localStorage.setItem(TWO_COLUMN_PRINT_KEY, String(isChecked));
        updateTwoColumnPrintClass(isChecked);
      });
    }

    function updateTwoColumnPrintClass(enabled) {
      document.body.classList.toggle('two-column-print', enabled);
    }

    function getSavedTagToggles() {
      try {
        const raw = localStorage.getItem(TAG_TOGGLE_STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        console.error('Failed to parse tag toggle settings', e);
        return {};
      }
    }

    function saveTagToggles(map) {
      try {
        localStorage.setItem(TAG_TOGGLE_STORAGE_KEY, JSON.stringify(map || {}));
      } catch (e) {
        console.error('Failed to save tag toggle settings', e);
      }
    }

    function initTagToggles() {
      if (!tagToggleContainer || !Array.isArray(TAGS_TO_TOGGLE) || TAGS_TO_TOGGLE.length === 0) return;

      const saved = getSavedTagToggles();
      tagToggleContainer.innerHTML = '';

      TAGS_TO_TOGGLE.forEach(({ tag, label }) => {
        const id = `toggle-tag-${tag}`;
        const isEnabled = saved[tag] !== false;

        const wrapper = document.createElement('label');
        wrapper.setAttribute('for', id);
        wrapper.className = 'w-full flex items-center gap-1.5 cursor-pointer select-none text-gray-700 dark:text-gray-300';
        wrapper.innerHTML = `
          <input type="checkbox" id="${id}" data-tag-toggle="${tag}"
            class="rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 dark:bg-gray-800">
          <span>${label}</span>
        `;

        const input = wrapper.querySelector('input');
        if (input) {
          input.checked = isEnabled;
          input.addEventListener('change', () => {
            const current = getSavedTagToggles();
            current[tag] = input.checked;
            saveTagToggles(current);
            applyTagVisibility(current);
          });
        }

        tagToggleContainer.appendChild(wrapper);
      });

      applyTagVisibility(saved);
    }

    function applyTagVisibility(settings) {
      const fileContentElement = document.getElementById('file-content');
      if (!fileContentElement || !Array.isArray(TAGS_TO_TOGGLE)) return;

      const state = settings || getSavedTagToggles();

      TAGS_TO_TOGGLE.forEach(({ tag }) => {
        const enabled = state[tag] !== false;
        fileContentElement.querySelectorAll(tag).forEach((el) => {
          el.classList.toggle('hidden', !enabled);
        });
      });
    }
    function applyTheme(mode) {
      // Toggle the 'dark' class on the <html> element
      if (mode === THEME_DARK) {
        htmlElement.classList.add(THEME_DARK);
        htmlElement.classList.remove(THEME_LIGHT);
        localStorage.setItem(THEME_KEY, THEME_DARK);
      } else {
        htmlElement.classList.remove(THEME_DARK);
        htmlElement.classList.add(THEME_LIGHT);
        localStorage.setItem(THEME_KEY, THEME_LIGHT);
      }

      // Toggle stylesheets (highlight.js + markdown) to match theme
      const isDark = mode === THEME_DARK;
      document.getElementById('hljs-dark').media = isDark ? 'all' : 'none';
      document.getElementById('hljs-light').media = isDark ? 'none' : 'all';
      document.getElementById('markdown-dark').media = isDark ? 'all' : 'none';
      document.getElementById('markdown-light').media = isDark ? 'none' : 'all';
    }


    function initVoiceController() {

      function populateVoices() {
        const voices = speechSynthesis.getVoices();
        const englishVoices = voices.filter(v => v.lang.startsWith('en'));
        voiceSelect.innerHTML = '<option value="">Select voice…</option>' +
          englishVoices.map(v => `<option value="${escapeHtmlAttr(v.name)}">${escapeHtmlAttr(v.name)} (${escapeHtmlAttr(v.lang)})</option>`).join('');

        const saved = localStorage.getItem(VOICE_STORAGE_KEY);
        if (saved && [...voiceSelect.options].some(o => o.value === saved)) {
          voiceSelect.value = saved;
        }
      }

      function escapeHtmlAttr(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      if (speechSynthesis.getVoices().length) {
        populateVoices();
      } else {
        speechSynthesis.addEventListener('voiceschanged', populateVoices);
      }

      voiceSelect.addEventListener('change', () => {
        const value = voiceSelect.value;
        if (value) localStorage.setItem(VOICE_STORAGE_KEY, value);
      });

      const savedSkipCode = localStorage.getItem(SKIP_CODE_BLOCKS_KEY);
      if (skipCodeBlocksCheckbox) {
        skipCodeBlocksCheckbox.checked = savedSkipCode === 'true';
        skipCodeBlocksCheckbox.addEventListener('change', () => {
          localStorage.setItem(SKIP_CODE_BLOCKS_KEY, String(skipCodeBlocksCheckbox.checked));
        });
      }

      function formatSpeechRateDisplay(v) {
        const x = clampSpeechRate(v);
        return (Math.round(x * 10) / 10).toFixed(1) + '×';
      }

      function syncSpeechRateUi() {
        if (!speechRateInput) return;
        const saved = localStorage.getItem(SPEECH_RATE_KEY);
        if (saved != null && saved !== '') {
          const r = clampSpeechRate(parseFloat(saved));
          speechRateInput.value = String(r);
        }
        if (speechRateValueEl) speechRateValueEl.textContent = formatSpeechRateDisplay(speechRateInput.value);
      }

      syncSpeechRateUi();
      if (speechRateInput) {
        speechRateInput.addEventListener('input', () => {
          const r = clampSpeechRate(parseFloat(speechRateInput.value));
          speechRateInput.value = String(r);
          localStorage.setItem(SPEECH_RATE_KEY, speechRateInput.value);
          if (speechRateValueEl) speechRateValueEl.textContent = formatSpeechRateDisplay(r);
        });
      }

      btnPlay.addEventListener('click', () => {
        const text = getSpeakableContent();
        if (!text) return;
        speakText(text);
      });

      btnPause.addEventListener('click', () => {
        if (speechSynthesis.speaking) speechSynthesis.pause();
      });

      btnResume.addEventListener('click', () => {
        // if (speechSynthesis.paused) speechSynthesis.resume();
        speechSynthesis.resume();
      });

      btnStop.addEventListener('click', () => {
        speechSynthesis.cancel();
      });
    }

    function getSpeakableContentFromRoot(rootEl) {
      if (!rootEl) return '';
      const clone = rootEl.cloneNode(true);
      clone.querySelectorAll('.md-heading-actions').forEach((w) => w.remove());
      if (skipCodeBlocksCheckbox && skipCodeBlocksCheckbox.checked) {
        clone.querySelectorAll('pre').forEach((pre) => {
          pre.innerText = codeblockAlternativeText;
        });
      }
      return clone.innerText || '';
    }

    function getSpeakableContent() {
      const el = document.getElementById('file-content');
      return getSpeakableContentFromRoot(el).trim();
    }

    function getHeadingLevel(tagName) {
      const m = /^H([1-6])$/i.exec(tagName || '');
      return m ? parseInt(m[1], 10) : 0;
    }

    /** Siblings after `heading` until the next heading of same or higher outline level. */
    function getSectionElementsAfterHeading(heading) {
      const level = getHeadingLevel(heading.tagName);
      const nodes = [];
      let n = heading.nextElementSibling;
      while (n) {
        const nextLevel = getHeadingLevel(n.tagName);
        if (nextLevel > 0 && nextLevel <= level) break;
        nodes.push(n);
        n = n.nextElementSibling;
      }
      return nodes;
    }

    function getSpeakableTextForHeadingSection(heading) {
      const wrap = document.createElement('div');
      wrap.appendChild(heading.cloneNode(true));
      getSectionElementsAfterHeading(heading).forEach((el) => {
        wrap.appendChild(el.cloneNode(true));
      });
      return getSpeakableContentFromRoot(wrap).trim();
    }

    /** Heading plus all following siblings inside the document (to end of article). */
    function getSpeakableTextFromHeadingToEnd(heading) {
      const wrap = document.createElement('div');
      wrap.appendChild(heading.cloneNode(true));
      let n = heading.nextElementSibling;
      while (n) {
        wrap.appendChild(n.cloneNode(true));
        n = n.nextElementSibling;
      }
      return getSpeakableContentFromRoot(wrap).trim();
    }

    const SECTION_PLAY_SVG =
      '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>';

    const SECTION_PLAY_TO_END_SVG =
      '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/><path d="M19 5h2v14h-2V5z"/></svg>';

    const HEADING_AUDIO_BTN_CLASS =
      'heading-audio-btn no-print p-2 rounded text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-colors';

    function speakText(text) {
      const t = String(text || '').trim();
      if (!t) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t);
      const voices = speechSynthesis.getVoices();
      const chosen = voiceSelect && voiceSelect.value && voices.find((v) => v.name === voiceSelect.value);
      if (chosen) u.voice = chosen;
      u.lang = 'en';
      if (speechRateInput) {
        u.rate = clampSpeechRate(parseFloat(speechRateInput.value));
      }
      speechSynthesis.speak(u);
    }

    function enhanceHeadingsWithSectionPlay(container) {
      if (!container) return;
      container.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach((heading) => {
        if (heading.querySelector('.md-heading-actions')) return;
        heading.classList.add('md-heading-with-play');

        const textWrap = document.createElement('span');
        textWrap.className = 'md-heading-text';
        while (heading.firstChild) {
          textWrap.appendChild(heading.firstChild);
        }

        const actions = document.createElement('span');
        actions.className = 'md-heading-actions';
        actions.setAttribute('role', 'group');
        actions.setAttribute('aria-label', 'Speech playback for this heading');

        const btnSection = document.createElement('button');
        btnSection.type = 'button';
        btnSection.className = HEADING_AUDIO_BTN_CLASS;
        btnSection.setAttribute('aria-label', 'Play section from this heading');
        btnSection.title = 'Play this section';
        btnSection.innerHTML = SECTION_PLAY_SVG;
        btnSection.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          speakText(getSpeakableTextForHeadingSection(heading));
        });

        const btnToEnd = document.createElement('button');
        btnToEnd.type = 'button';
        btnToEnd.className = HEADING_AUDIO_BTN_CLASS;
        btnToEnd.setAttribute('aria-label', 'Play from this heading to end of document');
        btnToEnd.title = 'Play from here to end';
        btnToEnd.innerHTML = SECTION_PLAY_TO_END_SVG;
        btnToEnd.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          speakText(getSpeakableTextFromHeadingToEnd(heading));
        });

        actions.appendChild(btnSection);
        actions.appendChild(btnToEnd);
        heading.appendChild(textWrap);
        heading.appendChild(actions);
      });
    }

    function updateUrl(path) {
      // Build URL with readable path: encode only &, =, % so slashes stay as /
      let newUrl = window.location.origin + window.location.pathname;
      if (path) {
        const safePath = path.replace(/%/g, '%25').replace(/&/g, '%26').replace(/=/g, '%3D');
        newUrl += '?path=' + safePath;
      }
      window.history.pushState({ path }, '', newUrl);
    }

    function getDirectories(root = '') {
      const url = root ? `/api/directories?root=${encodeURIComponent(root)}` : '/api/directories';
      fetch(url)
        .then(response => response.json())
        .then(data => {

          // const directories = root ? ['..', ...data] : data;
          const directories = ['..', ...data.list];
          renderDirectories(directories);
          if (data.fileContent) {
            renderFileContent(data.fileContent, url);
          } else {
            document.getElementById('file-content').innerHTML = '';
            buildTableOfContents(null);
          }
        })
        .catch(error => {
          console.error('Error fetching directories:', error);
        });
    }
    function renderDirectories(directories) {
      const directoriesList = document.getElementById('directories-list');
      directoriesList.innerHTML = directories.map(directory => {
        const isParent = directory === '..';
        const displayName = isParent ? '.. (go back)' : directory;
        // Escape HTML for data attribute
        const escapedDirectory = directory.replace(/"/g, '&quot;');
        return `<li class="cursor-pointer hover:text-blue-600 dark:hover:text-blue-400 hover:underline py-1 text-inherit" data-directory="${escapedDirectory}">${displayName}</li>`;
      }).join('');
    }
    function handleDirectoryClick(directory) {

      if (directory === '..') {
        // Go back to parent directory
        if (currentRootDirectory === '') {
          // At root, navigate to parent directory
          currentRootDirectory = '..';
        } else {
          // Remove the last path segment or add another '..'
          const pathParts = currentRootDirectory.split('/').filter(p => p);

          if (pathParts.length > 0 && pathParts[pathParts.length - 1] !== '..') {
            // Remove the last path segment if it's not '..'
            pathParts.pop();
            currentRootDirectory = pathParts.length > 0 ? pathParts.join('/') : '';
          } else {
            // Add another '..' to go further up
            currentRootDirectory = currentRootDirectory ? `${currentRootDirectory}/..` : '..';
          }
        }
      } else {
        // Navigate into the selected directory
        currentRootDirectory = currentRootDirectory
          ? `${currentRootDirectory}/${directory}`
          : directory;
      }
      // Update URL with new path
      updateUrl(currentRootDirectory);
      getDirectories(currentRootDirectory);
    }
    function renderDirectory(directory) {
      const directoryItem = document.createElement('div');
      directoryItem.classList.add('directory-item');
      directoryItem.innerHTML = `<a href="/${directory}">${directory}</a>`;
      return directoryItem;
    }

    function buildTableOfContents(contentEl) {
      const tocSidebar = document.getElementById('toc-sidebar');
      if (!tocSidebar) return;
      const headings = contentEl ? contentEl.querySelectorAll('h1, h2, h3, h4, h5, h6') : [];
      if (headings.length === 0) {
        tocSidebar.innerHTML = '';
        tocSidebar.classList.add('hidden');
        return;
      }
      const nav = document.createElement('nav');
      nav.setAttribute('aria-label', 'Table of contents');
      headings.forEach((h) => {
        const id = h.id || slugify(h.textContent);
        if (!h.id) h.id = id;
        const a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = h.textContent;
        a.classList.add('toc-' + h.tagName.toLowerCase());
        a.addEventListener('click', (e) => {
          e.preventDefault();
          document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
          history.replaceState(null, '', window.location.pathname + window.location.search + '#' + id);
        });
        nav.appendChild(a);
      });
      const title = document.createElement('div');
      title.className = 'font-semibold mb-2 text-gray-700 dark:text-gray-300';
      title.textContent = 'Table of Contents';
      tocSidebar.innerHTML = '';
      tocSidebar.appendChild(title);
      tocSidebar.appendChild(nav);
      tocSidebar.classList.remove('hidden');
    }

    function slugify(text) {
      return String(text || '')
        .trim()
        .toLowerCase()
        .replace(/\s+/g, '-')
        .replace(/[^\w-]+/g, '')
        .replace(/--+/g, '-')
        .replace(/^-|-$/g, '') || 'section';
    }

    function renderFileContent(fileContent, url) {
      const fileContentElement = document.getElementById('file-content');
      if (!fileContent) {
        fileContentElement.innerHTML = '';
        voiceControllerContent = '';
        return;
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Extension -> highlight.js language for raw source files (no Markdown)
      const codeExtensions = {
        '.java': 'java',
        '.js': 'javascript',
        '.ts': 'typescript',
        '.py': 'python',
        '.go': 'go',
        '.rs': 'rust',
        '.c': 'c',
        '.cpp': 'cpp',
        '.cs': 'csharp',
        '.rb': 'ruby',
        '.php': 'php',
        '.swift': 'swift',
        '.kt': 'kotlin',
        '.scala': 'scala',
        '.sql': 'sql',
        '.sh': 'bash',
        '.bash': 'bash',
        '.yaml': 'yaml',
        '.yml': 'yaml',
        '.json': 'json',
        '.xml': 'xml',
        '.html': 'html',
        '.css': 'css'
      };

      const ext = url.includes('.') ? '.' + url.split('.').pop().toLowerCase() : '';
      const language = codeExtensions[ext];

      if (language) {
        // Raw source file: render as a single code block (no Markdown)
        const escaped = escapeHtml(fileContent);
        fileContentElement.innerHTML = `<pre><code class="language-${language}">${escaped}</code></pre>`;
      } else {
        // Markdown or unknown: parse as Markdown
        const renderer = new marked.Renderer();
        renderer.code = function (code, lang) {
          const langClass = lang ? ` class="language-${lang}"` : '';
          return `<pre><code${langClass}>${escapeHtml(code)}</code></pre>`;
        };
        marked.setOptions({
          breaks: true,
          gfm: true,
          headerIds: true,
          mangle: false,
          renderer: renderer
        });
        fileContentElement.innerHTML = marked.parse(fileContent);
      }

      applyTagVisibility();

      voiceControllerContent = fileContentElement.innerText || '';

      buildTableOfContents(fileContentElement);
      enhanceHeadingsWithSectionPlay(fileContentElement);

      // Scroll to hash if present in URL (e.g. after refresh or direct link)
      if (window.location.hash) {
        const id = window.location.hash.slice(1);
        setTimeout(() => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' }), 100);
      }

      // Highlight all code blocks using highlight.js
      // Use setTimeout to ensure DOM is ready
      setTimeout(() => {
        if (typeof hljs !== 'undefined' && hljs.highlightElement) {
          fileContentElement.querySelectorAll('pre code').forEach((block) => {
            try {
              // Remove any existing highlight classes to avoid conflicts
              block.classList.remove('hljs');
              // Highlight the code block
              hljs.highlightElement(block);
            } catch (err) {
              console.error('Error highlighting code block:', err);
            }
          });
        } else {
          console.error('Highlight.js is not loaded');
        }
      }, 0);
    }
  </script>
